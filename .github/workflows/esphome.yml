name: ESPHome & Codebase CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc g++ make

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync

      - name: Setup mock secrets for YAML validation
        run: cp esphome/secrets.yaml.example esphome/secrets.yaml

      - name: Run Linters & Static Analysis
        run: make lint

      - name: Check Code Formatting
        run: make format-check

      - name: Run Test Suites (GD32 C99, ESPHome C++, Python tools & configs)
        run: make test

      - name: Validate Graphic Assets
        run: make validate-assets

  release:
    name: Build & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync

      - name: Setup mock secrets for YAML compilation
        run: cp esphome/secrets.yaml.example esphome/secrets.yaml

      - name: Build GD32 Coprocessor Firmware & Pack Graphic Assets
        run: |
          make build-gd32
          make pack-assets
          make validate-assets
          cp firmware/gd32/build/gd32_firmware.bin gd32_firmware.bin
          md5sum gd32_firmware.bin | cut -d' ' -f1 > gd32_firmware.bin.md5
          sha256sum gd32_firmware.bin | cut -d' ' -f1 > gd32_firmware.bin.sha256
          cp firmware/gd32/build/flash_assets.bin flash_assets.bin
          md5sum flash_assets.bin | cut -d' ' -f1 > flash_assets.bin.md5
          sha256sum flash_assets.bin | cut -d' ' -f1 > flash_assets.bin.sha256

      - name: Compile Standalone ESP32 Firmware
        run: |
          uv run esphome compile esphome/htram.yaml

      - name: Package Release Binaries & Checksums
        id: pkg
        run: |
          bin_path="esphome/.esphome/build/htram/build/firmware.ota.bin"
          if [ ! -f "$bin_path" ]; then
            bin_path="esphome/.esphome/build/htram/build/htram.bin"
          fi
          cp "$bin_path" htram-standalone.bin
          md5sum htram-standalone.bin | cut -d' ' -f1 > htram-standalone.bin.md5
          sha256sum htram-standalone.bin | cut -d' ' -f1 > htram-standalone.bin.sha256
          size=$(stat -c%s htram-standalone.bin)
          md5=$(cat htram-standalone.bin.md5)
          sha=$(cat htram-standalone.bin.sha256)
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "md5=$md5" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Keep release binaries for this run
        uses: actions/upload-artifact@v4
        with:
          name: htram-release-binaries
          path: |
            htram-standalone.bin*
            gd32_firmware.bin*
            flash_assets.bin*
          retention-days: 14

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            ver=$(python3 -c "import re; print(re.search(r'firmware_version:\s*[\"\'\']?([^\"\'\'\s]+)', open('esphome/htram-core.yaml', encoding='utf-8').read()).group(1))")
            tag="v${ver}"
          fi

          notes_file="docs/RELEASE_NOTES_${tag}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Release notes $notes_file not found; creating default..."
            echo "# HTRAM Release ${tag}" > "$notes_file"
          fi

          # Create release if it does not exist yet
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Creating GitHub Release $tag..."
            gh release create "$tag" --title "$tag" --notes-file "$notes_file" --target "$GITHUB_SHA"
          else
            echo "Release $tag already exists on GitHub; uploading/updating assets."
          fi

          gh release upload "$tag" \
            htram-standalone.bin \
            htram-standalone.bin.md5 \
            htram-standalone.bin.sha256 \
            gd32_firmware.bin \
            gd32_firmware.bin.md5 \
            gd32_firmware.bin.sha256 \
            flash_assets.bin \
            flash_assets.bin.md5 \
            flash_assets.bin.sha256 \
            --clobber

