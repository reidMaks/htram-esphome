# HTRAM Simulator Core Configuration (Linux Native Host Platform)
# Emulates ESP32 firmware on Linux host binary, sharing identical UI (core-ui.yaml)
# and hardware arbiter architecture.

substitutions:
  name: htram-sim
  friendly_name: "HTRAM Simulator"
  repo_url: "."
  ota_done_rtttl: "Flashed:d=16,o=6,b=240:a,b,c7"

packages:
  ui: !include core-ui.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - sim_time.h
  on_boot:
    - priority: 600
      then:
        - text_sensor.template.publish:
            id: device_id
            state: "sim001"
        - text_sensor.template.publish:
            id: wifi_ip
            state: "127.0.0.1"
    - priority: -100
      then:
        - lambda: |-
            id(htram_arbiter_hub)->set_core(id(htram_core));
        - script.execute: refresh_face
        - script.execute:
            id: apply_scheduled_brightness
            smooth: false

host:

logger:
  level: DEBUG

api:
  port: 6053
  services:
    - service: inject_button
      variables:
        action: string
      then:
        - lambda: |-
            id(htram_arbiter_hub)->dispatch_button_action(action);

    - service: inject_event
      variables:
        event: string
      then:
        - lambda: |-
            id(htram_arbiter_hub)->dispatch_event(event);

    - service: play_rtttl
      variables:
        song: string
      then:
        - lambda: |-
            id(htram_core)->play_rtttl(song);

    - service: stop_melody
      then:
        - lambda: |-
            id(htram_core)->send_stop();

    - service: beep
      variables:
        freq: int
        duration: int
      then:
        - lambda: |-
            id(htram_core)->send_beep(freq, duration);

    - service: take_screenshot
      variables:
        filename: string
      then:
        - lambda: |-
            lv_refr_now(nullptr);
            id(htram_core)->dump_ppm(filename);
            ESP_LOGI("sim", "Screenshot dumped to %s", filename.c_str());

    - service: simulate_telemetry
      variables:
        temp: float
        hum: float
        co2: float
        batt_pct: float
        usb: bool
      then:
        - lambda: |-
            if (!isnan(temp)) {
              id(t_from_gd32) = temp;
              float trim = id(temp_trim).state;
              id(sensor_temp).publish_state(isnan(trim) ? temp : temp + trim);
            }
            if (!isnan(hum)) id(sensor_hum).publish_state(hum);
            if (!isnan(co2)) id(sensor_co2).publish_state(co2);
            if (!isnan(batt_pct)) id(sensor_batt_level).publish_state(batt_pct);
            id(sensor_usb).publish_state(usb);
            id(refresh_slot).execute();
            id(refresh_pocket).execute();

    - service: show_device_id
      then:
        - script.execute: show_device_id

    - service: show_network
      then:
        - script.execute: show_network

    - service: simulate_boot_state
      variables:
        net_ok: int
        time_ok: int
      then:
        - lambda: |-
            id(sim_override_net) = net_ok;
            id(sim_override_time) = time_ok;
            id(face_state) = -1;
        - script.execute: refresh_face
        - script.execute: refresh_clock
        - script.execute: refresh_slot

    - service: simulate_ap_state
      variables:
        ap_ok: int
      then:
        - lambda: |-
            id(sim_override_ap) = ap_ok;
            id(face_state) = -1;
            id(refresh_face).execute();

    - service: simulate_reboot_resync
      then:
        - lambda: |-
            id(sim_override_net) = 1;
            id(sim_override_time) = 1;
            id(sim_override_ap) = 0;
            id(face_state) = -1;
            id(htram_arbiter_hub)->release_screen("overlay");
            id(htram_arbiter_hub)->release_screen("weather");
            id(htram_arbiter_hub)->release_screen("timer");
            id(htram_arbiter_hub)->release_screen("ap");
            id(htram_arbiter_hub)->release_screen("climate");
            id(htram_arbiter_hub)->reset_audio();
        - script.execute: refresh_face
        - script.execute: refresh_clock
        - script.execute: refresh_slot
        - script.execute: refresh_pocket

    - service: set_sim_time
      variables:
        epoch: int
        freeze: bool
      then:
        - lambda: |-
            htram_sim::set_time((time_t) epoch, freeze);
            id(face_state) = -1;
            id(slot_idx) = 0;
            id(htram_arbiter_hub)->dispatch_event("time_synced");
            id(htram_arbiter_hub)->dispatch_event("time_second");
            id(htram_arbiter_hub)->dispatch_event("time_minute");
        - script.execute: refresh_face
        - script.execute: refresh_clock
        - script.execute: refresh_slot

    - service: set_sim_slot
      variables:
        idx: int
      then:
        - lambda: |-
            id(slot_idx) = idx;
        - script.execute: refresh_slot

    - service: step_sim_time
      variables:
        seconds: int
      then:
        - lambda: |-
            htram_sim::step_time(seconds);
            id(htram_arbiter_hub)->dispatch_event("time_second");
            id(htram_arbiter_hub)->dispatch_event("time_minute");
        - script.execute: refresh_clock
        - script.execute: refresh_slot

    - service: reset_sim_time
      then:
        - lambda: |-
            htram_sim::reset_time();
            id(face_state) = -1;
            id(slot_idx) = 0;
            id(htram_arbiter_hub)->dispatch_event("time_synced");
        - script.execute: refresh_face
        - script.execute: refresh_clock
        - script.execute: refresh_slot

external_components:
  - source:
      type: local
      path: custom_components
    components: [htram_gd32, htram_arbiter]

uart:
  id: uart_bus
  baud_rate: 921600
  port: /dev/null

htram_gd32:
  id: htram_core
  uart_id: uart_bus
  simulation_mode: true

htram_arbiter:
  id: htram_arbiter_hub
  events:
    - event: button_triple
      context: any
      priority: 10
      name: core_show_device_id
      then:
        - script.execute: show_device_id
    - event: button_single
      context: modal_ap
      priority: 100
      name: core_toggle_ap_page
      then:
        - lambda: |-
            id(ap_manual) = true;
            id(ap_page) ^= 1;
            id(face_state) = -1;
            lv_obj_invalidate(lv_screen_active());
        - script.execute: refresh_face
    - event: button_quadruple
      context: modal_ap
      priority: 100
      name: core_dismiss_ap_quadruple
      then:
        - script.execute: dismiss_wifi_setup
    - event: button_double
      context: modal_ap
      priority: 100
      name: core_dismiss_ap_double
      then:
        - script.execute: dismiss_wifi_setup
    - event: button_many
      context: modal_ap
      priority: 100
      name: core_dismiss_ap_many
      then:
        - script.execute: dismiss_wifi_setup
    - event: button_long
      context: modal_ap
      priority: 100
      name: core_dismiss_ap_long
      then:
        - script.execute: dismiss_wifi_setup
    - event: screen_preempted
      context: modal_ap
      priority: 100
      name: core_preempt_ap
      then:
        - script.execute: dismiss_wifi_setup
    - event: button_single
      context: modal_overlay
      priority: 100
      name: core_dismiss_overlay
      then:
        - script.stop: show_device_id
        - lambda: |-
            id(htram_arbiter_hub)->release_screen("overlay");
            lv_obj_add_flag(id(ui_devid), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ui_devid_cap), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(ui_pocket), LV_OBJ_FLAG_HIDDEN);
            id(slot_hold) = false;
        - script.execute: refresh_face
        - script.execute: refresh_pocket
    - event: screen_preempted
      context: modal_overlay
      priority: 100
      name: core_preempt_overlay
      then:
        - script.stop: show_device_id
        - lambda: |-
            id(htram_arbiter_hub)->release_screen("overlay");
            lv_obj_add_flag(id(ui_devid), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ui_devid_cap), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(ui_pocket), LV_OBJ_FLAG_HIDDEN);
            id(slot_hold) = false;
    - event: button_many
      context: any
      priority: 10
      name: core_setup_wifi_many
      then:
        - script.execute: start_wifi_setup
    - event: button_quadruple
      context: any
      priority: 10
      name: core_setup_wifi_quadruple
      then:
        - script.execute: start_wifi_setup
    - event: time_synced
      context: any
      priority: 9
      name: core_auto_brightness_on_time_sync
      then:
        - script.execute:
            id: apply_scheduled_brightness
            smooth: false

time:
  - platform: host
    id: ha_time
    timezone: "Europe/Kyiv"
    on_time_sync:
      then:
        - lambda: |-
            id(face_state) = -1;
            id(htram_arbiter_hub)->dispatch_event("time_synced");
        - script.execute: refresh_face
  - platform: host
    id: net_time
    timezone: "Europe/Kyiv"

globals:
  - id: current_backlight_val
    type: float
    restore_value: false
    initial_value: "100.0"
  - id: day_brightness
    type: float
    restore_value: false
    initial_value: "100.0"
  - id: led_auto
    type: bool
    restore_value: false
    initial_value: "false"
  - id: t_from_gd32
    type: float
    restore_value: false
    initial_value: "21.5"

script:
  - id: refresh_leds
    then: []

  # Плавна зміна яскравості дисплея за 3–4 секунди кроками по 100 мс
  - id: fade_backlight
    mode: restart
    parameters:
      target: float
    then:
      - lambda: |-
          if (target < 0.0f) target = 0.0f;
          if (target > 100.0f) target = 100.0f;
      - while:
          condition:
            lambda: |-
              return std::abs(id(current_backlight_val) - target) > 0.5f;
          then:
            - lambda: |-
                float cur = id(current_backlight_val);
                float step = (target - cur) * 0.15f;
                if (std::abs(step) < 1.0f) {
                  step = (target > cur) ? 1.0f : -1.0f;
                }
                cur += step;
                if ((step > 0.0f && cur > target) || (step < 0.0f && cur < target)) {
                  cur = target;
                }
                id(current_backlight_val) = cur;
                id(htram_core)->send_backlight((uint8_t) std::round(cur));
            - delay: 100ms
      - lambda: |-
          id(current_backlight_val) = target;
          id(htram_core)->send_backlight((uint8_t) std::round(target));
          id(screen_brightness).publish_state(target);

  # Застосування розкладу яскравості відповідно до поточного часу
  - id: apply_scheduled_brightness
    mode: restart
    parameters:
      smooth: bool
    then:
      - lambda: |-
          if (!id(night_mode_enabled).state) {
            float day_target = id(day_brightness);
            if (smooth) {
              id(fade_backlight).execute(day_target);
            } else {
              id(current_backlight_val) = day_target;
              id(htram_core)->send_backlight((uint8_t) std::round(day_target));
              id(screen_brightness).publish_state(day_target);
            }
            return;
          }
          auto now = id(ha_time).now();
          if (!now.is_valid()) now = id(net_time).now();
          if (!now.is_valid()) return;

          int cur_min = now.hour * 60 + now.minute;
          int night_min = id(night_start_time).hour * 60 + id(night_start_time).minute;
          int day_min = id(day_start_time).hour * 60 + id(day_start_time).minute;
          bool is_night = false;
          if (night_min > day_min) {
            is_night = (cur_min >= night_min || cur_min < day_min);
          } else if (night_min < day_min) {
            is_night = (cur_min >= night_min && cur_min < day_min);
          }
          float target = is_night ? id(night_brightness).state : id(day_brightness);
          if (smooth) {
            id(fade_backlight).execute(target);
          } else {
            id(current_backlight_val) = target;
            id(htram_core)->send_backlight((uint8_t) std::round(target));
            id(screen_brightness).publish_state(target);
          }

  - id: !extend set_system_alert_active
    then:
      - lambda: |-
          id(alert_status_sensor).publish_state(active);

  - id: start_wifi_setup
    mode: restart
    then:
      - lambda: |-
          id(sim_override_ap) = 1;
          id(htram_arbiter_hub)->request_screen(5, "ap");
          id(ap_manual) = false;
          id(ap_page) = 0;
          id(face_state) = -1;
          id(refresh_face).execute();

  - id: dismiss_wifi_setup
    mode: restart
    then:
      - lambda: |-
          id(sim_override_ap) = 0;
          id(ap_manual) = false;
          if (id(htram_arbiter_hub)->get_screen_owner() == "ap") {
            id(htram_arbiter_hub)->release_screen("ap");
          }
          lv_obj_invalidate(id(ui_root));
          id(face_state) = -1;
      - script.execute: refresh_face
      - script.execute: refresh_clock
      - script.execute: refresh_slot
      - script.execute: refresh_pocket

sensor:
  - platform: template
    id: sensor_co2
    name: "CO2"
    accuracy_decimals: 0
    unit_of_measurement: "ppm"

  - platform: template
    id: sensor_temp
    name: "Temperature"
    accuracy_decimals: 1
    unit_of_measurement: "°C"

  - platform: template
    id: sensor_hum
    name: "Humidity"
    accuracy_decimals: 0
    unit_of_measurement: "%"

  - platform: template
    id: sensor_batt_level
    name: "Battery"
    accuracy_decimals: 0
    unit_of_measurement: "%"

  - platform: template
    id: sensor_batt_mv
    name: "Battery Voltage"
    accuracy_decimals: 0
    unit_of_measurement: "mV"

binary_sensor:
  - platform: template
    id: sensor_usb
    name: "USB Power"

  - platform: template
    id: sensor_chrg
    name: "Charging"

  - platform: template
    id: htram_button
    name: "Button"

  - platform: template
    id: alert_status_sensor
    name: "Alert Active"

text_sensor:
  - platform: template
    id: wifi_ip
    name: "IP Address"

  - platform: template
    id: device_id
    name: "Device ID"


datetime:
  - platform: template
    id: night_start_time
    name: "Початок ночі"
    type: time
    optimistic: true
    restore_value: false
    initial_value: "23:00:00"
    icon: "mdi:clock-start"
    on_time:
      - if:
          condition:
            lambda: return id(night_mode_enabled).state;
          then:
            - script.execute:
                id: fade_backlight
                target: !lambda "return id(night_brightness).state;"
    on_value:
      - script.execute:
          id: apply_scheduled_brightness
          smooth: true

  - platform: template
    id: day_start_time
    name: "Початок дня"
    type: time
    optimistic: true
    restore_value: false
    initial_value: "07:00:00"
    icon: "mdi:clock-end"
    on_time:
      - if:
          condition:
            lambda: return id(night_mode_enabled).state;
          then:
            - script.execute:
                id: fade_backlight
                target: !lambda "return id(day_brightness);"
    on_value:
      - script.execute:
          id: apply_scheduled_brightness
          smooth: true

number:
  - platform: template
    name: "Screen Brightness"
    id: screen_brightness
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    set_action:
      - lambda: |-
          id(fade_backlight).stop();
          id(current_backlight_val) = x;
          id(htram_core)->send_backlight((uint8_t) std::round(x));

          bool is_night = false;
          if (id(night_mode_enabled).state) {
            auto now = id(ha_time).now();
            if (!now.is_valid()) now = id(net_time).now();
            if (now.is_valid()) {
              int cur_min = now.hour * 60 + now.minute;
              int night_min = id(night_start_time).hour * 60 + id(night_start_time).minute;
              int day_min = id(day_start_time).hour * 60 + id(day_start_time).minute;
              if (night_min > day_min) is_night = (cur_min >= night_min || cur_min < day_min);
              else if (night_min < day_min) is_night = (cur_min >= night_min && cur_min < day_min);
            }
          }
          if (!is_night) {
            id(day_brightness) = x;
          }

  - platform: template
    name: "Нічна яскравість"
    id: night_brightness
    icon: "mdi:brightness-4"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 4
    restore_value: false
    optimistic: true
    set_action:
      - lambda: |-
          if (id(night_mode_enabled).state) {
            auto now = id(ha_time).now();
            if (!now.is_valid()) now = id(net_time).now();
            if (now.is_valid()) {
              int cur_min = now.hour * 60 + now.minute;
              int night_min = id(night_start_time).hour * 60 + id(night_start_time).minute;
              int day_min = id(day_start_time).hour * 60 + id(day_start_time).minute;
              bool is_night = false;
              if (night_min > day_min) is_night = (cur_min >= night_min || cur_min < day_min);
              else if (night_min < day_min) is_night = (cur_min >= night_min && cur_min < day_min);
              if (is_night) {
                id(fade_backlight).execute(x);
              }
            }
          }

  - platform: template
    name: "Підстроювання температури"
    id: temp_trim
    min_value: -10
    max_value: 10
    step: 0.1
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          if (!isnan(id(t_from_gd32))) {
            id(sensor_temp).publish_state(id(t_from_gd32) + x);
            id(refresh_slot).execute();
          }

switch:
  - platform: template
    name: "Нічний розклад"
    id: night_mode_enabled
    icon: "mdi:weather-night"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute:
          id: apply_scheduled_brightness
          smooth: true
    on_turn_off:
      - script.execute:
          id: fade_backlight
          target: !lambda "return id(day_brightness);"
