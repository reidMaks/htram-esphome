# HTRAM Feature: Повітряна тривога та загрози (Standalone Air Raid & Threat Alerts via JAAM Cloud WS)
#
# Надає інтеграцію з відкритим публічним хмарним сервером JAAM (ws.jaam.net.ua:80/data_fusion_v1, https://jaam.net.ua):
# - 0 токенів / API ключів, відкритий WebSocket;
# - Отримання прапорців усіх типів загроз (повітряна, артобстріл, вуличні бої, хімічна, радіаційна,
#   дрони, ракети, КАБи, балістика, вибухи, розвіддрони);
# - Звукове сповіщення через диспетчер звуку з найвищим пріоритетом (SOUND_PRIO_ALERT = 40);
# - Відображення піктограми найвищої за пріоритетом загрози у верхньому статусному слоті;
# - Перефарбовування цифр годинника відповідно до типу тривоги та зелений колір при відбої;
# - Індикатор втрати зв'язку з сервером тривог (ui_nolink);
# - Збереження обраного регіону в NVS з можливістю зміни через веб-інтерфейс.

substitutions:
  alert_start_rtttl: "AlertOn:d=8,o=6,b=180:a,b,c7,16p,a,b,c7"
  alert_escalate_rtttl: "AlertUp:d=16,o=6,b=200:c7,e7,c7,e7,8p,c7,e7,c7,e7,8p,c7,e7,c7,4e7"
  alert_deescalate_rtttl: "AlertDown:d=8,o=6,b=180:e7,a,16p,c7,a"
  alert_clear_rtttl: "AlertOff:d=8,o=6,b=180:c7,b,a"
  alert_urgent_rtttl: "AlertUrgent:d=16,o=7,b=220:f,p,f,p,f,8p,f,p,f,p,f"
  alert_cbrn_rtttl: "AlertCBRN:d=8,o=6,b=200:g,d7,g,d7,g,d7,4g7"
  alert_recon_rtttl: "AlertRecon:d=16,o=6,b=160:e7,8p,e7"
  alert_mark_minutes: "5"
  jaam_host: "ws.jaam.net.ua"
  jaam_port: "80"

external_components:
  - source:
      type: local
      path: custom_components
    components: [jaam_ws]

jaam_ws:
  id: jaam
  host: ${jaam_host}
  port: ${jaam_port}
  path: "/data_fusion_v1"
  region_id: 31
  on_flags:
    then:
      - lambda: |-
          // Біти з ALERT_TYPES інтеграції JAAM:
          // 0 повітряна (legacy), 1 артобстріл, 2 вуличні бої, 3 хімічна, 4 радіаційна,
          // 5 дрони, 6 ракети, 7 КАБи, 8 балістика, 9 вибухи, 10 розвідники,
          // 11 жовтий рівень (дрон-загроза), 12 червоний рівень (ракети).
          const bool yellow    = flags & (1u << 11);
          const bool red       = flags & (1u << 12);
          const bool red_air   = (flags & (1u << 0)) || red;
          const bool air       = red_air || yellow;
          const bool artillery = flags & (1u << 1);
          const bool urban     = flags & (1u << 2);
          const bool chemical  = flags & (1u << 3);
          const bool nuclear   = flags & (1u << 4);
          const bool drone     = flags & (1u << 5);
          const bool missile   = flags & (1u << 6);
          const bool kab       = flags & (1u << 7);
          const bool ballistic = flags & (1u << 8);
          const bool explosion = flags & (1u << 9);
          const bool recon     = flags & (1u << 10);

          const bool any_alert  = air || artillery || urban || chemical || nuclear;
          const bool new_yellow = yellow && !red_air && !artillery && !urban && !chemical && !nuclear;

          const bool prev_alert     = id(alert_active);
          const bool prev_yellow    = id(alert_yellow);
          const bool prev_artillery = id(alert_artillery);
          const bool prev_chemical  = id(alert_chemical);
          const bool prev_nuclear   = id(alert_nuclear);
          const bool prev_kab       = id(alert_kab);
          const bool prev_ballistic = id(alert_ballistic);
          const bool prev_explosion = id(alert_explosion);
          const bool prev_recon     = id(alert_recon);

          const bool new_cbrn   = (nuclear && !prev_nuclear) || (chemical && !prev_chemical);
          const bool new_urgent = (ballistic && !prev_ballistic) || (kab && !prev_kab) ||
                                  (explosion && !prev_explosion) || (artillery && !prev_artillery);
          const bool new_recon  = recon && !prev_recon;

          id(alert_artillery) = artillery;
          id(alert_urban)     = urban;
          id(alert_chemical)  = chemical;
          id(alert_nuclear)   = nuclear;
          id(alert_ballistic) = ballistic;
          id(alert_kab)       = kab;
          id(alert_missile)   = missile;
          id(alert_drone)     = drone;
          id(alert_explosion) = explosion;
          id(alert_recon)     = recon;
          id(alert_yellow)    = new_yellow;

          uint32_t active_color = 0xE5484D;
          if (nuclear || chemical) {
            active_color = 0xD946EF;
          } else if (red_air || urban) {
            active_color = 0xE5484D;
          } else if (artillery) {
            active_color = 0xFF6B2B;
          } else if (new_yellow) {
            active_color = 0xFFC53D;
          }

          if (any_alert != prev_alert) {
            id(alert_active) = any_alert;
            auto now = id(ha_time).now();
            if (!now.is_valid()) now = id(net_time).now();
            time_t epoch = ::time(nullptr);
            const uint32_t ts = now.is_valid() ? now.timestamp : (uint32_t) epoch;
            if (any_alert) {
              id(alert_mark_until) = 0;
              id(alert_mark_color) = (int) active_color;
              if (new_cbrn) {
                id(play_alert_threat_sound).execute(2);
              } else if (new_urgent) {
                id(play_alert_threat_sound).execute(1);
              } else {
                id(play_alert_sound).execute(true);
              }
            } else {
              id(alert_mark_until) = ts + ${alert_mark_minutes} * 60;
              id(alert_mark_color) = 0x3DD68C;
              id(play_alert_sound).execute(false);
            }
          } else if (any_alert) {
            id(alert_mark_color) = (int) active_color;
            if (new_cbrn) {
              id(play_alert_threat_sound).execute(2);
            } else if (new_urgent) {
              id(play_alert_threat_sound).execute(1);
            } else if (new_yellow != prev_yellow) {
              id(play_alert_level_sound).execute(!new_yellow);
            }
          } else {
            if (new_urgent) {
              id(play_alert_threat_sound).execute(1);
            } else if (new_recon) {
              id(play_alert_threat_sound).execute(3);
            }
          }
          id(set_system_alert_active).execute(any_alert);
      - script.execute: refresh_alert_marks
      - script.execute: refresh_alert_icon
      - script.execute: on_alert_changed

globals:
  - id: alert_region
    type: int
    restore_value: true
    initial_value: "31" # За замовчуванням м. Київ (region_id 31 у JAAM)
  - id: alert_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_yellow
    type: bool
    restore_value: false
    initial_value: "false"
  - id: jaam_seen_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: alert_mark_until
    type: int
    restore_value: false
    initial_value: "0"
  - id: alert_mark_color
    type: int
    restore_value: false
    initial_value: "0"
  - id: alert_artillery
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_urban
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_chemical
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_nuclear
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_ballistic
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_kab
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_missile
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_drone
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_explosion
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_recon
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alert_icon_drawn_asset
    type: int
    restore_value: false
    initial_value: "-1"
  - id: alert_icon_color
    type: int
    restore_value: false
    initial_value: "0xE5484D"
  - id: alert_nolink_drawn
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: !extend on_geo_settings_changed
    then:
      - lambda: |-
          id(alert_region) = region;
          id(jaam)->set_region_id(region);

  - id: play_alert_sound
    parameters:
      air: bool
    mode: restart
    then:
      - script.stop: play_alert_level_sound
      - script.stop: play_alert_threat_sound
      - lambda: |-
          id(htram_arbiter_hub)->play_rtttl(40, "alert", air ? "${alert_start_rtttl}"
                                                             : "${alert_clear_rtttl}");
      - delay: 2s
      - lambda: |-
          id(htram_arbiter_hub)->stop_sound("alert");

  - id: play_alert_level_sound
    parameters:
      escalated: bool
    mode: restart
    then:
      - script.stop: play_alert_sound
      - script.stop: play_alert_threat_sound
      - lambda: |-
          id(htram_arbiter_hub)->play_rtttl(
              40, "alert",
              escalated ? "${alert_escalate_rtttl}" : "${alert_deescalate_rtttl}");
      - delay: 2500ms
      - lambda: |-
          id(htram_arbiter_hub)->stop_sound("alert");

  - id: play_alert_threat_sound
    parameters:
      kind: int
    mode: restart
    then:
      - script.stop: play_alert_sound
      - script.stop: play_alert_level_sound
      - lambda: |-
          const char *rtttl = "${alert_urgent_rtttl}";
          if (kind == 2) rtttl = "${alert_cbrn_rtttl}";
          else if (kind == 3) rtttl = "${alert_recon_rtttl}";
          id(htram_arbiter_hub)->play_rtttl(40, "alert", rtttl);
      - delay: 2500ms
      - lambda: |-
          id(htram_arbiter_hub)->stop_sound("alert");

  - id: refresh_alert_icon
    then:
      - lambda: |-
          const bool has_icon = id(alert_active) || id(alert_nuclear) || id(alert_chemical) ||
                                id(alert_explosion) || id(alert_ballistic) || id(alert_kab) ||
                                id(alert_missile) || id(alert_artillery) || id(alert_urban) ||
                                id(alert_drone) || id(alert_recon);
          uint16_t asset_id = htram_gd32::ASSET_ID_ALERT;
          uint32_t color_hex = id(alert_yellow) ? 0xFFC53D : 0xE5484D;

          if (has_icon) {
            id(htram_arbiter_hub)->request_status_icon("alert", 100);
            if (id(alert_nuclear)) {
              asset_id = htram_gd32::ASSET_ID_THREAT_NUCLEAR;
              color_hex = 0xFFD60A;
            } else if (id(alert_chemical)) {
              asset_id = htram_gd32::ASSET_ID_THREAT_CHEMICAL;
              color_hex = 0xD946EF;
            } else if (id(alert_explosion)) {
              asset_id = htram_gd32::ASSET_ID_THREAT_EXPLOSION;
              color_hex = 0xFF6B2B;
            } else if (id(alert_ballistic)) {
              asset_id = htram_gd32::ASSET_ID_THREAT_BALLISTIC;
              color_hex = 0xE5484D;
            } else if (id(alert_kab)) {
              asset_id = htram_gd32::ASSET_ID_THREAT_KAB;
              color_hex = 0xE5484D;
            } else if (id(alert_missile)) {
              asset_id = htram_gd32::ASSET_ID_THREAT_MISSILE;
              color_hex = 0xE5484D;
            } else if (id(alert_artillery)) {
              asset_id = htram_gd32::ASSET_ID_THREAT_ARTILLERY;
              color_hex = 0xFF6B2B;
            } else if (id(alert_urban)) {
              asset_id = htram_gd32::ASSET_ID_THREAT_URBAN;
              color_hex = 0xE5484D;
            } else if (id(alert_drone)) {
              asset_id = htram_gd32::ASSET_ID_THREAT_DRONE;
              color_hex = id(alert_yellow) ? 0xFFC53D : 0xE5484D;
            } else if (id(alert_recon)) {
              asset_id = htram_gd32::ASSET_ID_THREAT_RECON;
              color_hex = 0xFFC53D;
            }
            id(alert_icon_color) = (int) color_hex;
          } else {
            id(htram_arbiter_hub)->clear_status_icon("alert");
          }

          const bool is_top = (id(htram_arbiter_hub)->get_top_status_icon_owner() == "alert");
          const bool can_show = is_top && (id(htram_arbiter_hub)->get_screen_mode() == 0) && !id(slot_hold);
          if (can_show) {
            if (id(alert_icon_drawn_asset) >= 0 && id(alert_icon_drawn_asset) != (int) asset_id) {
              id(htram_core)->send_clear_cached_asset_centered((uint16_t) id(alert_icon_drawn_asset), 190, 86);
            }
            id(htram_core)->send_draw_cached_asset_centered(
                asset_id, 190, 86, Color((uint32_t) id(alert_icon_color)), Color(0x000000), 1);
            id(alert_icon_drawn_asset) = (int) asset_id;
          } else if (id(alert_icon_drawn_asset) >= 0) {
            id(htram_core)->send_clear_cached_asset_centered((uint16_t) id(alert_icon_drawn_asset), 190, 86);
            id(alert_icon_drawn_asset) = -1;
          }

  - id: refresh_alert_marks
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) now = id(net_time).now();
          time_t epoch = ::time(nullptr);
          const uint32_t t = now.is_valid() ? now.timestamp : (uint32_t) epoch;

          uint32_t want = 0xF0EAE0;
          if (id(alert_active)) {
            if (id(alert_nuclear) || id(alert_chemical)) {
              want = 0xD946EF;
            } else if (id(alert_mark_color) != 0) {
              want = (uint32_t) id(alert_mark_color);
            } else {
              want = id(alert_yellow) ? 0xFFC53D : 0xE5484D;
            }
          } else if (t < (uint32_t) id(alert_mark_until)) {
            want = (uint32_t) id(alert_mark_color);
          }

          static uint32_t shown = 0xF0EAE0;
          if (want == shown) return;
          shown = want;
          id(apply_face_alert_color).execute(want);

  - id: !extend on_face_changed
    then:
      - lambda: |-
          if (face != 0) {
            if (id(alert_icon_drawn_asset) >= 0) {
              id(htram_core)->send_clear_cached_asset_centered((uint16_t) id(alert_icon_drawn_asset), 190, 86);
              id(alert_icon_drawn_asset) = -1;
            }
            if (id(alert_nolink_drawn)) {
              id(htram_core)->send_clear_cached_asset_centered(htram_gd32::ASSET_ID_ALERT_SMALL, 209, 209);
              id(alert_nolink_drawn) = false;
            }
          } else {
            id(refresh_alert_icon).execute();
          }

  - id: !extend on_screen_drawn
    then:
      - lambda: |-
          const bool is_top = (id(htram_arbiter_hub)->get_top_status_icon_owner() == "alert");
          const bool can_show = is_top && (id(htram_arbiter_hub)->get_screen_mode() == 0) && !id(slot_hold);
          if (can_show && id(alert_icon_drawn_asset) >= 0) {
            id(htram_core)->send_draw_cached_asset_centered(
                (uint16_t) id(alert_icon_drawn_asset), 190, 86,
                Color((uint32_t) id(alert_icon_color)), Color(0x000000), 1);
          }

interval:
  - interval: 1s
    then:
      - script.execute: refresh_alert_marks

  - interval: 2s
    then:
      - script.execute:
          id: set_system_alert_active
          active: !lambda "return id(alert_active);"
      - script.execute:
          id: set_system_jaam_connected
          connected: !lambda "return id(jaam)->connected();"

  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now_ms = millis();
          if (id(jaam)->connected()) id(jaam_seen_ms) = now_ms;
          const bool lost = id(jaam_seen_ms) == 0
                                ? now_ms > 30000
                                : (now_ms - id(jaam_seen_ms)) > 30000;
          if (lost != id(alert_nolink_drawn)) {
            id(alert_nolink_drawn) = lost;
            if (lost) {
              id(htram_core)->send_draw_cached_asset_centered(
                  htram_gd32::ASSET_ID_ALERT_SMALL, 209, 209, Color(0x707880), Color(0x000000), 1);
            } else {
              id(htram_core)->send_clear_cached_asset_centered(
                  htram_gd32::ASSET_ID_ALERT_SMALL, 209, 209);
            }
          }

esphome:
  on_boot:
    - priority: 100
      then:
        - lambda: |-
            id(jaam)->set_region_id(id(alert_region));
    - priority: -100
      then:
        - script.execute:
            id: set_system_alert_active
            active: !lambda "return id(alert_active);"
        - script.execute: refresh_alert_icon
        - script.execute: refresh_alert_marks
