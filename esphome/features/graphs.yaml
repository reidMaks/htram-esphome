# HTRAM Feature: Графіки показників за добу (Daily Telemetry Graphs)
#
# Надає модальний екран перегляду добових графіків (24 години):
# - CO2 (смарагдовий графік із заливкою, шкалою 0..24h та мін/макс мітками);
# - Температура (теплий бурштиновий графік із заливкою);
# - Вологість (небесно-блакитний графік із заливкою);
# - Триптих (три компактні sparkline-графіки один під одним);
# - Суміщений графік (всі 3 нормалізовані криві на спільній осі часу).
#
# Керування:
# - 4 кліки кнопки (button_quadruple) з годинника відкривають екран графіків;
# - Подвійний клік (button_double) перемикає варіанти/метрики по колу (0..4);
# - Одинарний клік (button_single) закриває екран і повертає на годинник;
# - Автозакриття через 60 с бездіяльності.

substitutions:
  graphs_co2_entity: "sensor.htram_9436b0_co2"
  graphs_temp_entity: "sensor.htram_9436b0_temperature"
  graphs_hum_entity: "sensor.htram_9436b0_humidity"
  graphs_screen_timeout: "60s"

globals:
  - id: graphs_shown
    type: bool
    restore_value: false
    initial_value: "false"

  - id: graphs_page
    type: int
    restore_value: false
    initial_value: "0" # 0=CO2, 1=Temp, 2=Hum, 3=Triptych Stacked, 4=Combined Overlay

  - id: graphs_co2_data
    type: "std::vector<float>"
    restore_value: false
    initial_value: "std::vector<float>{620, 610, 600, 595, 590, 610, 680, 820, 1050, 1180, 1250, 1310, 1280, 1220, 1270, 1340, 1390, 1350, 1210, 980, 850, 760, 690, 640}"

  - id: graphs_temp_data
    type: "std::vector<float>"
    restore_value: false
    initial_value: "std::vector<float>{19.8, 19.6, 19.5, 19.4, 19.4, 19.5, 19.8, 20.2, 20.8, 21.4, 21.9, 22.3, 22.6, 22.7, 22.5, 22.2, 21.8, 21.3, 20.9, 20.6, 20.4, 20.3, 20.0, 19.9}"

  - id: graphs_hum_data
    type: "std::vector<float>"
    restore_value: false
    initial_value: "std::vector<float>{68.0, 69.5, 71.0, 72.5, 73.0, 72.0, 70.0, 67.5, 64.0, 61.5, 59.0, 57.5, 56.0, 56.5, 58.0, 61.0, 64.5, 68.0, 71.0, 73.5, 74.5, 74.0, 71.5, 69.5}"

button:
  - platform: template
    name: "Показати графіки"
    id: btn_show_graphs
    icon: "mdi:chart-line"
    on_press:
      - script.execute: show_graphs

