# HTRAM — Вітальня (htram-c1da24)
#
# Локальна збірка / прошивка:
#   uv run esphome run esphome/htram-c1da24.yaml
#
# На сервері ESPHome (https://esphome.kms-lab.in.ua/):
#   Вставте наступний вміст у htram-c1da24.yaml:
#   -------------------------------------------------
#   substitutions:
#     name: htram-c1da24
#     friendly_name: "HTRAM c1da24"
#     area: "Вітальня"
#
#   esphome:
#     area: ${area}
#
#   packages:
#     base:
#       url: https://github.com/reidMaks/htram-esphome
#       ref: main
#       files:
#         - esphome/htram-core.yaml
#         - esphome/features/alarm.yaml
#       refresh: 0s
#   -------------------------------------------------

substitutions:
  name: htram-c1da24
  friendly_name: "HTRAM c1da24"
  area: "Вітальня"
  repo_url: "."

esphome:
  area: ${area}

packages:
  core: !include htram-core.yaml
  alarm: !include features/alarm.yaml
