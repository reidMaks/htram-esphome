# HTRAM — Конфігурація для пристрою htram-954f48 (без будильника)
#
# Локальна збірка / прошивка:
#   uv run esphome run esphome/htram-954f48.yaml
#
# На сервері ESPHome (https://esphome.kms-lab.in.ua/):
#   Вставте наступний вміст у htram-954f48.yaml:
#   -------------------------------------------------
#   substitutions:
#     name: htram-954f48
#     friendly_name: "HTRAM 954f48"
#
#   packages:
#     core:
#       url: https://github.com/reidMaks/htram-esphome
#       ref: main
#       files: [esphome/htram-core.yaml]
#       refresh: 0s
#   -------------------------------------------------

substitutions:
  name: htram-954f48
  friendly_name: "HTRAM 954f48"
  repo_url: "."

packages:
  core: !include htram-core.yaml
