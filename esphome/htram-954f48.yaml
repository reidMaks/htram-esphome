# HTRAM — Спальня (htram-954f48)
#
# Локальна збірка / прошивка:
#   uv run esphome run esphome/htram-954f48.yaml
#
# На сервері ESPHome (https://esphome.kms-lab.in.ua/):
#   Вставте наступний вміст у htram-954f48.yaml:
#   -------------------------------------------------
#   substitutions:
#     name: htram-954f48
#     friendly_name: "HTRAM 954f48"
#     area: "Спальня"
#
#   esphome:
#     area: ${area}
#
#   packages:
#     base:
#       url: https://github.com/reidMaks/htram-esphome
#       ref: main
#       files:
#         - esphome/htram-core.yaml
#         - esphome/features/alarm.yaml
#       refresh: 0s
#   -------------------------------------------------

substitutions:
  name: htram-954f48
  friendly_name: "HTRAM 954f48"
  area: "Спальня"
  repo_url: "."

esphome:
  area: ${area}

packages:
  core: !include htram-core.yaml
  alarm: !include features/alarm.yaml
