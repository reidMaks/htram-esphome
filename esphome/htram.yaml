# HTRAM — повна конфігурація з усіма функціями (Core + Alarm + Weather + Timer)
#
# Локальна збірка / прошивка:
#   uv run esphome run esphome/htram.yaml
#
# На сервері ESPHome (https://esphome.kms-lab.in.ua/):
#   Вставте наступний вміст у свій конфіг:
#   -------------------------------------------------
#   substitutions:
#     name: htram
#     friendly_name: "HTRAM"
#
#   packages:
#     base:
#       url: https://github.com/reidMaks/htram-esphome
#       ref: main
#       files:
#         - esphome/htram-core.yaml
#         - esphome/features/face_clock.yaml
#         - esphome/features/silence.yaml
#         - esphome/features/alert.yaml
#         - esphome/features/alarm.yaml
#         - esphome/features/weather.yaml
#         - esphome/features/timer.yaml
#       refresh: 0s
#   -------------------------------------------------

substitutions:
  name: htram
  friendly_name: HTRAM
  name_add_mac_suffix: "false"
  repo_url: "."
  firmware_version: "2.0.0"

packages:
  core: !include htram-core.yaml
  face_clock: !include features/face_clock.yaml
  silence: !include features/silence.yaml
  alert: !include features/alert.yaml
  alarm: !include features/alarm.yaml
  weather: !include features/weather.yaml
  timer: !include features/timer.yaml

htram_web:
  id: htram_standalone_web
  on_save_settings:
    then:
      - lambda: |-
          id(alert_region) = region;
          id(jaam)->set_region_id(region);
          id(weather_lat) = lat;
          id(weather_lon) = lon;
          id(weather_city_name) = city;
          id(fetch_weather_forecast).execute();
          id(refresh_face).execute();

interval:
  - interval: 5s
    then:
      - lambda: |-
          if (id(alert_active) != id(htram_standalone_web).is_alert_active()) {
            id(htram_standalone_web).set_alert_active(id(alert_active));
          }
