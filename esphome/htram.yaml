substitutions:
  name: htram
  # Мелодія Вербицького (1863) — суспільне надбання. Уривок, що грає в кінці
  # хвилини мовчання; ~9.8 с на b=200.
  # Метроном хвилини мовчання. Значення взяті з прошивки мапи тривог JAAM
  # (`MOS_BEEP:d=4,o=4,b=250:g` раз на 2000 мс), бо саме такий звук впізнається
  # як меморіальний метроном: соль малої октави, майже чверть секунди — низький
  # протяжний удар. Вище й коротше — і це вже писк будильника, перевірено.
  # Палітра хвилини мовчання. Фон лишається чорним не з економії, а тому що
  # матриця квадратна, а рамка навколо скла кругла: будь-яка суцільна заливка
  # проявляє квадрат посеред кола. Чорний зливається з рамкою, і видно лише те,
  # що світиться, — на цьому побудоване все обличчя. Червоне на чорному ще й
  # точніше за регістром: це колір скорботи, а не державності.
  silence_bg: "0x000000"
  silence_fg: "0xC1121F"
  silence_tick_seconds: "2"
  silence_tick_hz: "392"
  silence_tick_ms: "240"
  anthem_rtttl: "UkraineAnthem:d=4,o=5,b=200:2d5,4d5,32p,4d5,32p,4d5,32p,4c5,4d5,4d#5,2f5,32p,4f5,4d#5,2d5,2c5,2a#4,2d5,2a4,2d5,1g4,32p,1g4"
  friendly_name: HTRAM
  # Home Assistant weather entity the outdoor slot reads from.
  weather_entity: weather.forecast_home

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Several of these are going to live in the same house, and they are all
  # flashed from this one config. The MAC suffix keeps their hostnames and
  # entity ids apart without a per-device file. Drop this line to go back to a
  # plain "htram".
  name_add_mac_suffix: true
  on_boot:
    - priority: 600
      then:
        - text_sensor.template.publish:
            id: device_id
            state: !lambda "return esphome::get_mac_address().substr(6);"
    # LVGL builds its widget tree in setup(), so anything that touches ui_* has
    # to wait until every component is up.
    - priority: -100
      then:
        - script.execute: refresh_leds
        - script.execute: refresh_face

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

logger:
  baud_rate: 115200

api:
  encryption:
    key: !secret api_key
  services:
    - service: beep
      variables:
        freq: int
        dur: int
      then:
        - lambda: |-
            id(htram_core)->send_beep(freq, dur);
            
    - service: set_backlight
      variables:
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_backlight(brightness);

    - service: set_leds
      variables:
        r: int
        y: int
        g: int
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_leds(r, y, g, brightness);

    - service: enter_bootloader
      then:
        - lambda: |-
            id(htram_core)->send_enter_bootloader();

    - service: play_rtttl
      variables:
        song: string
      then:
        - lambda: |-
            id(htram_core)->play_rtttl(song);

    - service: stop_melody
      then:
        - lambda: |-
            id(htram_core)->send_stop();

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    # The fallback AP is the only way into a unit that cannot reach the house
    # network, and web_server sits behind it with full control of the device.
    # An open AP hands that to anyone within radio range.
    password: !secret ap_password

captive_portal:

# BLE (2026-09-06). Перевірено на живому пристрої: 0 зривів LVGL, телеметрія
# в нормі, ~70 КБ вільної купи. Активне сканування — щоб HA бачив імена, а не
# самі адреси.
esp32_ble_tracker:
  scan_parameters:
    active: true

# Проксі, але тільки як вуха: пересилає рекламу в Home Assistant і не дозволяє
# йому підключатись до пристроїв через нас. Підключення — це слот пам'яті на
# кожне, а купа тут і так найдефіцитніший ресурс; реклами ж достатньо для
# всього, заради чого це робилось (присутність, iBeacon, BTHome-датчики).
#
# Сенс саме в проксі, а не в ble_presence на пристрої: розпізнавання живе в HA,
# тож новий телефон чи новий спосіб трекінгу — це правка в HA, а не збірка й
# перепрошивка. Випадкових MAC воно, втім, не скасовує: телефон і годинник
# крутять адресу, і для них усе одно потрібен IRK (private_ble_device) або
# маяк iBeacon із застосунку-компаньйона.
bluetooth_proxy:
  active: false

# Скільки пам'яті лишається під навантаженням, і чому саме перезавантажився.
debug:
  update_interval: 30s

web_server:
  port: 80
  # Reachable from the whole LAN, and from anyone on the fallback AP. Digest
  # rather than basic: the password never crosses the wire in a reversible form.
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

external_components:
  - source: custom_components

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  # 921600 since the GD32 stopped blocking its main loop for longer than the
  # 2 KB RX ring can absorb (SHT30 split in two, CO2 poll behind flow control).
  # The resident flasher inherits USART1_BAUD from the firmware, so GD32 OTA
  # runs at this speed too.
  baud_rate: 921600

htram_gd32:
  id: htram_core
  uart_id: uart_bus

display:
  - platform: htram_gd32
    id: htram_display
    update_interval: never

image:
  # Малий Державний Герб. Джерело — SVG користувача, з якого взято сам знак
  # (у файлі він темний на світлому полі щита) і збережено як однобітну маску:
  # у LVGL вона стає LV_COLOR_FORMAT_A1, тобто силуетом без власного кольору.
  # 2 КБ замість 32 КБ, які коштувало б те саме зображення в RGB565, а колір
  # накладає refresh_face. Державні символи не є об'єктом авторського права.
  - file: "images/tryzub_mask.png"
    id: img_tryzub
    type: BINARY

font:
  # Digits only, and pre-slanted: ESPHome renders from the TTF at build time and
  # LVGL has no shear, so the 12 deg oblique is baked into the file by
  # tools/fonts/make_oblique.py. 4 bpp matters here — the ExtraLight stem is
  # 5 px wide and 1 bpp would shred it.
  - file: "fonts/DejaVuSans-ExtraLight-Oblique.ttf"
    id: font_clock
    size: 92
    bpp: 4
    glyphs: "0123456789-"

  # Sixteen glyphs, for the one thing that is read deliberately rather than
  # glanced at: the device id, shown big enough to read across a desk.
  - file: "fonts/NotoSans-Regular.ttf"
    id: font_id
    size: 44
    bpp: 4
    glyphs: "0123456789abcdef"

  # The caption line stays upright, and in a regular weight: measured at 15 px,
  # ExtraLight has a 1 px stem that never reaches full white (peak 240/255),
  # while Noto Sans gets 2 px at 255. Going bigger does not fix it -- ExtraLight
  # is still 1 px at 17 px -- so this is about weight, not size.
  - file: "fonts/NotoSans-Regular.ttf"
    id: font_slot
    size: 15
    bpp: 4
    glyphs: "0123456789.,:%-+ °"
    glyphsets:
      - GF_Cyrillic_Core

  # Everything the face says when it cannot show a clock: the two failure
  # messages, the IP address, and -- the reason the Latin alphabet is in here --
  # the fallback AP's own SSID and password, which are the one thing a user
  # cannot look up anywhere else at that moment. 22 px = 2.5 mm.
  #
  # The Cyrillic part is an explicit list rather than GF_Cyrillic_Core: eleven
  # letters are actually used, and the glyphset would cost ~200 glyphs at 22 px.
  # The punctuation set is what a Wi-Fi password realistically contains; a
  # password using anything outside it renders as a placeholder box, so either
  # keep ap_password alphanumeric or extend this line.
  - file: "fonts/NotoSans-Regular.ttf"
    id: font_msg
    size: 22
    bpp: 4
    glyphs: " !#$%&()*+,-.:;=?@[]_{}~/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzаежімнрсучє"

globals:
  - id: ha_link
    type: bool
    restore_value: false
    initial_value: "false"
  - id: slot_idx
    type: int
    restore_value: false
    initial_value: "0"
  - id: slot_hold
    type: bool
    restore_value: false
    initial_value: "false"
  - id: led_auto
    type: bool
    restore_value: true
    initial_value: "true"
  # 0 = clock, 1 = no time, 2 = no network, -1 = unknown/overlay dirtied it.
  # lv_label_set_text invalidates unconditionally, so the message is only
  # written when the state behind it actually changed.
  - id: face_state
    type: int
    restore_value: false
    initial_value: "-1"
  # 09:00, one minute, every day. Kept as device state rather than a Home
  # Assistant automation on purpose: this is the one minute of the day where
  # "it did not fire because HA was restarting" is not an acceptable outcome.
  - id: silence_active
    type: bool
    restore_value: false
    initial_value: "false"
  # Окремо від silence_active: обличчя лишається синім і на час гімну, а
  # метроном на цей час мусить замовкнути. CMD_BEEP на GD32 не додає ноту в
  # чергу, а заміщає її (`mel_count = 1`), тож один тік обриває мелодію —
  # рівно це й сталось на першій перевірці.
  - id: silence_ticking
    type: bool
    restore_value: false
    initial_value: "false"
  # The AP face has two pages: 0 = QR to scan, 1 = the same credentials as text.
  - id: ap_page
    type: int
    restore_value: false
    initial_value: "0"
  # Set by the first button press on the AP face. Until then the two pages
  # alternate on their own, which is what makes the second one discoverable;
  # afterwards the button owns them, because seven seconds is not enough to
  # copy a password and a timer that takes it away mid-word is hostile.
  - id: ap_manual
    type: bool
    restore_value: false
    initial_value: "false"

script:
  # Hours and minutes are separate labels: only the minutes row is dirty most of
  # the time, and staggering them needs independent x offsets anyway.
  - id: refresh_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          // lv_label_set_text invalidates unconditionally, so each digit is
          // written only when it actually changed.
          static int prev[4] = {-1, -1, -1, -1};
          const int cur[4] = {now.hour / 10, now.hour % 10,
                              now.minute / 10, now.minute % 10};
          lv_obj_t *const lbl[4] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2)};
          char buf[2] = {0, 0};
          for (int i = 0; i < 4; i++) {
            if (cur[i] == prev[i]) continue;
            prev[i] = cur[i];
            buf[0] = '0' + cur[i];
            lv_label_set_text(lbl[i], buf);
          }

  # One caption line, three facts, rotating every 7 s.
  # Which unit am I looking at? Triple-click and the caption says so for a few
  # seconds, then goes back to its rotation. Nothing permanent is added to the
  # face for something you need about twice a year.
  - id: show_device_id
    mode: restart
    then:
      - script.stop: show_network
      - lambda: |-
          /* Identifying a unit is a deliberate act, not a glance, so it takes
             over the whole face rather than whispering from the caption line
             at 1.7 mm. The clock comes back six seconds later. */
          id(slot_hold) = true;
          id(face_state) = -1;
          std::string s = esphome::get_mac_address().substr(6);
          lv_label_set_text(id(ui_devid), s.c_str());
          lv_obj_t *const hide[] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2),
                                    id(ui_slot), id(ui_pocket), id(ui_msg),
                                    id(ui_msg_sub), id(ui_msg_cap), id(ui_msg2),
                                    id(ui_ap_card), id(ui_ap_qr)};
          for (auto *o : hide) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_devid), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_devid_cap), LV_OBJ_FLAG_HIDDEN);
      - delay: 6s
      - lambda: |-
          lv_obj_add_flag(id(ui_devid), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(ui_devid_cap), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_pocket), LV_OBJ_FLAG_HIDDEN);
          id(slot_hold) = false;
      - script.execute: refresh_face
      - script.execute: refresh_clock
      - script.execute: refresh_slot
      - script.execute: refresh_pocket

  # A clock with no time is dashes, and dashes look like a broken screen rather
  # than an explanation. Whenever the time is not set, the face says why instead.
  # A working clock is never hidden: losing the network while the time is
  # already known leaves the clock alone and speaks through the pocket and slot.
  - id: refresh_face
    then:
      - lambda: |-
          if (id(slot_hold)) return;  // the ID / IP overlay owns the face

          // The fallback AP is the only state where the device is actively
          // asking for help and can do nothing else useful -- no HA, no
          // weather, nothing. So it outranks even a valid clock.
          const bool ap = captive_portal::global_captive_portal != nullptr &&
                          captive_portal::global_captive_portal->is_active();
          const bool net = wifi::global_wifi_component->is_connected();
          const bool have_time = id(ha_time).now().is_valid();

          // Priority, as written down in TODO §13: the AP outranks everything
          // (a device asking to be configured can do nothing else useful), then
          // the minute of silence, then the ordinary faces.
          const int want = ap ? 3 : (id(silence_active) ? 4 : (have_time ? 0 : (net ? 1 : 2)));
          if (want != 3) id(ap_manual) = false;
          if (want == id(face_state)) return;
          id(face_state) = want;

          lv_obj_t *const face[] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2),
                                    id(ui_slot)};
          for (auto *o : face) {
            if (want == 0)
              lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }

          lv_obj_t *const msg[] = {id(ui_msg_cap), id(ui_msg), id(ui_msg_sub),
                                   id(ui_msg2), id(ui_ap_card), id(ui_ap_qr)};
          for (auto *o : msg) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);

          // The blue only exists during the minute; everything else is drawn on
          // black, so this is set and unset here rather than per widget.
          lv_obj_set_style_bg_color(id(ui_root),
                                    lv_color_hex(want == 4 ? ${silence_bg} : 0x000000),
                                    LV_PART_MAIN);
          // The dot keeps its ordinary job -- it just has to be visible against
          // the blue, and against the blue it becomes the flag's other colour.
          lv_obj_set_style_bg_color(id(ui_secdot),
                                    lv_color_hex(want == 4 ? ${silence_fg} : 0xB9AFA3),
                                    LV_PART_MAIN);

          if (want == 4) {
            // The emblem carries no colour of its own -- A1 is a silhouette --
            // so it is tinted here rather than baked into the asset.
            lv_obj_set_style_image_recolor(id(ui_tryzub), lv_color_hex(${silence_fg}),
                                           LV_PART_MAIN);
            lv_obj_set_style_image_recolor_opa(id(ui_tryzub), LV_OPA_COVER,
                                               LV_PART_MAIN);
            lv_obj_remove_flag(id(ui_tryzub), LV_OBJ_FLAG_HIDDEN);
            // Nothing else is shown. The seconds dot is already circling, and
            // starting at 09:00:00 it completes exactly one revolution as the
            // minute runs out -- motion that costs nothing and means the right
            // thing.
            return;
          }
          lv_obj_add_flag(id(ui_tryzub), LV_OBJ_FLAG_HIDDEN);

          if (want == 0) return;

          if (want == 3) {
            // Both strings come from the running config rather than being
            // repeated here, so they cannot drift from what the radio answers.
            auto cfg = wifi::global_wifi_component->get_ap();
            const std::string ssid = cfg.get_ssid().c_str();
            const std::string pass = cfg.get_password().c_str();

            lv_label_set_text(id(ui_msg_cap), "точка доступу");
            lv_obj_align(id(ui_msg_cap), LV_ALIGN_CENTER, 0,
                         id(ap_page) == 0 ? 76 : -62);
            lv_obj_remove_flag(id(ui_msg_cap), LV_OBJ_FLAG_HIDDEN);

            if (id(ap_page) == 0) {
              // The whole join, in one scan. The modules land at ~0.55 mm on a
              // 27 mm panel, which is close to what a phone camera resolves --
              // hence page 1, which is the same credentials typed out.
              const std::string qr = "WIFI:T:WPA;S:" + ssid + ";P:" + pass + ";;";
              lv_qrcode_update(id(ui_ap_qr), qr.c_str(), qr.size());
              lv_obj_remove_flag(id(ui_ap_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(ui_ap_qr), LV_OBJ_FLAG_HIDDEN);
              return;
            }

            lv_label_set_text(id(ui_msg), ssid.c_str());
            lv_obj_align(id(ui_msg), LV_ALIGN_CENTER, 0, -30);
            lv_label_set_text(id(ui_msg_sub), "пароль");
            lv_obj_align(id(ui_msg_sub), LV_ALIGN_CENTER, 0, 4);
            lv_label_set_text(id(ui_msg2), pass.c_str());
            lv_obj_align(id(ui_msg2), LV_ALIGN_CENTER, 0, 34);
            lv_obj_remove_flag(id(ui_msg), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(ui_msg2), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          lv_label_set_text(id(ui_msg), net ? "немає часу" : "немає мережі");
          lv_obj_align(id(ui_msg), LV_ALIGN_CENTER, 0, -14);
          lv_label_set_text(id(ui_msg_sub),
                            net ? "чекаю сервер часу" : "шукаю мережу");
          lv_obj_align(id(ui_msg_sub), LV_ALIGN_CENTER, 0, 16);
          lv_obj_remove_flag(id(ui_msg), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);

  # Double-click: the address, for the six seconds it takes to type it in.
  # Same deliberate-act reasoning as the device id -- nothing permanent on the
  # face for something needed twice a year, but reachable without a router UI.
  - id: show_network
    mode: restart
    then:
      - script.stop: show_device_id
      - lambda: |-
          id(slot_hold) = true;
          id(face_state) = -1;
          std::string ip = id(wifi_ip).state;
          if (ip.empty() || ip == "0.0.0.0") ip = "немає мережі";
          lv_label_set_text(id(ui_msg_cap), "адреса");
          lv_obj_align(id(ui_msg_cap), LV_ALIGN_CENTER, 0, -24);
          lv_label_set_text(id(ui_msg), ip.c_str());
          lv_obj_align(id(ui_msg), LV_ALIGN_CENTER, 0, 2);
          lv_obj_add_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_msg_cap), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *const hide[] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2),
                                    id(ui_slot), id(ui_pocket), id(ui_devid),
                                    id(ui_devid_cap), id(ui_msg2),
                                    id(ui_ap_card), id(ui_ap_qr)};
          for (auto *o : hide) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_msg), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
      - delay: 6s
      - lambda: id(slot_hold) = false;
      - script.execute: refresh_face
      - script.execute: refresh_clock
      - script.execute: refresh_slot
      - script.execute: refresh_pocket

  # 09:00. Flag blue, a metronome tick a second the way broadcasts mark it, and
  # the LEDs dark: a green "the air is fine" light through this minute would be
  # the wrong thing to say. Runs on the device; Home Assistant only gets a
  # switch to turn the whole thing off, since this unit may not be in Ukraine.
  - id: minute_of_silence
    mode: single
    then:
      - lambda: |-
          id(silence_active) = true;
          id(silence_ticking) = true;
          id(face_state) = -1;
          id(htram_core)->send_leds(0, 0, 0, 0);
      - script.execute: refresh_face
      # The ticking itself lives in the 1 s interval below, the same one that
      # moves the dot: sound and motion then share a clock instead of each
      # keeping its own. A `repeat` with a delay drifts by however long the
      # loop took, and only ever ticks after everything else has finished.
      - delay: 60s
      # The minute ends, and the anthem closes it -- the face stays as it is
      # until the melody is done, which is what the delay is for. The metronome
      # has to stop first: a beep replaces whatever the buzzer is playing.
      - lambda: |-
          id(silence_ticking) = false;
          id(htram_core)->play_rtttl("${anthem_rtttl}");
      - delay: 11s
      - lambda: |-
          id(silence_active) = false;
          id(face_state) = -1;
      - script.execute: refresh_face
      - script.execute: refresh_clock
      - script.execute: refresh_slot
      - script.execute: refresh_pocket
      - script.execute: refresh_leds

  - id: refresh_slot
    then:
      - lambda: |-
          if (id(slot_hold)) return;
          char buf[48];
          switch (id(slot_idx)) {
            case 0: {
              auto now = id(ha_time).now();
              if (!now.is_valid()) return;
              static const char *const DAYS[] = {"", "Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"};
              // Three letters, not the full month: "Пн, 22 листопада" is 138 px
              // and the content circle only offers 117 px at this baseline.
              static const char *const MONTHS[] = {
                  "", "січ", "лют", "бер", "кві", "тра", "чер",
                  "лип", "сер", "вер", "жов", "лис", "гру"};
              snprintf(buf, sizeof(buf), "%s, %d %s",
                       DAYS[now.day_of_week >= 1 && now.day_of_week <= 7 ? now.day_of_week : 0],
                       now.day_of_month,
                       MONTHS[now.month >= 1 && now.month <= 12 ? now.month : 0]);
              break;
            }
            case 1: {
              if (!wifi::global_wifi_component->is_connected()) {
                snprintf(buf, sizeof(buf), "немає мережі");
                break;
              }
              if (isnan(id(outdoor_temp).state)) { snprintf(buf, sizeof(buf), "--° надворі"); break; }
              // The condition replaces the last word rather than adding a glyph:
              // a 1.8 mm pictogram is ambiguous where a 1.2 mm word is not.
              std::string w = id(outdoor_cond).state;
              const char *word = "надворі";
              if (w == "rainy" || w == "pouring" || w == "lightning-rainy" || w == "hail") word = "дощ";
              else if (w == "snowy" || w == "snowy-rainy") word = "сніг";
              else if (w == "windy" || w == "windy-variant") word = "вітер";
              snprintf(buf, sizeof(buf), "%.0f° %s", id(outdoor_temp).state, word);
              break;
            }
            default: {
              if (isnan(id(sensor_temp).state) || isnan(id(sensor_hum).state)) return;
              snprintf(buf, sizeof(buf), "%.1f°  %.0f%%",
                       id(sensor_temp).state, id(sensor_hum).state);
              break;
            }
          }
          lv_label_set_text(id(ui_slot), buf);

  # The pocket is empty whenever nothing needs the eye. Percentage rather than a
  # battery glyph: at 1.8 mm a glyph is mush and "62%" is not.
  - id: refresh_pocket
    then:
      - lambda: |-
          // Charge level and API link are independent facts, so they no longer
          // gate each other: coupling them meant every gap between API clients
          // (an `esphome logs` session ending counts) hid the battery.
          const bool warn = !id(ha_link);
          const bool on_batt = !id(sensor_usb).state &&
                               !isnan(id(sensor_batt_level).state);

          ESP_LOGD("pocket", "link=%d usb=%d batt=%.0f -> warn=%d batt_icon=%d",
                   (int) id(ha_link), (int) id(sensor_usb).state,
                   id(sensor_batt_level).state, (int) warn, (int) on_batt);

          lv_label_set_text(id(ui_pocket), warn ? "!" : "");

          lv_obj_t *const batt[3] = {id(ui_batt_body), id(ui_batt_nub), id(ui_batt_fill)};
          for (int i = 0; i < 3; i++) {
            if (on_batt)
              lv_obj_remove_flag(batt[i], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(batt[i], LV_OBJ_FLAG_HIDDEN);
          }
          if (!on_batt) return;

          const float pct = id(sensor_batt_level).state;
          const uint32_t c = pct < 20 ? 0xFF9E3D : 0x9AA2AC;
          int w = (int) lroundf(18.0f * (pct < 0 ? 0 : (pct > 100 ? 100 : pct)) / 100.0f);
          if (w < 1) w = 1;
          lv_obj_set_width(id(ui_batt_fill), w);
          lv_obj_set_style_bg_color(id(ui_batt_fill), lv_color_hex(c), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(ui_batt_nub), lv_color_hex(c), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(ui_batt_body), lv_color_hex(c), LV_PART_MAIN);

  # CO2 moved off the screen and onto the LEDs above it, so they have to
  # actually track it now.
  - id: refresh_leds
    then:
      - lambda: |-
          if (!id(led_auto)) return;
          // The GD32 lights green at boot to say "I am alive", and the NDIR
          // needs minutes before it has a number. Leaving that green up meant
          // the device asserted clean air while it had measured nothing at all,
          // which is the one claim it must never make on faith.
          if (isnan(id(sensor_co2).state)) {
            id(htram_core)->send_leds(0, 0, 0, 0);
            return;
          }
          uint16_t ppm = (uint16_t) id(sensor_co2).state;
          id(htram_core)->send_leds(ppm >= 1500, ppm >= 1000 && ppm < 1500, ppm < 1000, 0);

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(silence_ticking)) {
            static uint32_t sec = 0;
            if (sec++ % ${silence_tick_seconds} == 0) {
              id(htram_core)->send_beep(${silence_tick_hz}, ${silence_tick_ms});
            }
          }
      # A GD32 that has just restarted spent its first ~700 ms with no USART1,
      # so the top of our last frame and every command we sent in that window
      # were dropped on the floor -- which is why a standby wake used to leave
      # a strip of the GD32's own boot screen across the top of the face, in
      # the one band LVGL never invalidates again. It tells us when it is ready
      # now; everything it missed goes out again here.
      - lambda: |-
          if (id(htram_core)->consume_gd32_boot()) {
            ESP_LOGI("resync", "GD32 restarted: full repaint + LED/backlight resend");
            id(htram_core)->send_backlight((uint8_t) id(screen_brightness).state);
            id(htram_core)->resend_leds();
            id(face_state) = -1;          // the face may be stale as well
            id(refresh_face).execute();
            id(refresh_leds).execute();   // auto mode overrides the resend
            lv_obj_invalidate(lv_screen_active());
          }
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          // Moving the dot invalidates only where it was and where it lands.
          float a = (now.second * 6.0f - 90.0f) * 3.14159265f / 180.0f;
          lv_obj_set_pos(id(ui_secdot),
                         (lv_coord_t) lroundf(120.0f + 113.0f * cosf(a) - 3.5f),
                         (lv_coord_t) lroundf(120.0f + 113.0f * sinf(a) - 3.5f));
          static int last_min = -1;
          if (now.minute != last_min) {
            last_min = now.minute;
            id(refresh_clock).execute();
            if (id(slot_idx) == 0) id(refresh_slot).execute();
          }

  - interval: 7s
    then:
      - lambda: id(slot_idx) = (id(slot_idx) + 1) % 3;
      - script.execute: refresh_slot
      # Same rhythm flips the AP face between the QR and the typed credentials,
      # until somebody takes the wheel with the button.
      - lambda: |-
          if (id(face_state) == 3 && !id(ap_manual)) {
            id(ap_page) ^= 1;
            id(face_state) = -1;   // force refresh_face to repaint
            id(refresh_face).execute();
          }

  # Polled, not edge-tracked: on_client_disconnected fires whenever any client
  # leaves, so a passing `esphome logs` session used to latch the warning on.
  - interval: 5s
    then:
      - if:
          condition: api.connected
          then:
            - lambda: |-
                if (!id(ha_link)) { id(ha_link) = true; id(refresh_pocket).execute(); }
          else:
            - lambda: |-
                if (id(ha_link)) { id(ha_link) = false; id(refresh_pocket).execute(); }
      - script.execute: refresh_face

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # Only on this one platform: both write the same system clock, so arming
      # the cron on each of them would fire the minute twice.
      - hours: 9
        minutes: 0
        seconds: 0
        then:
          - if:
              condition:
                switch.is_on: silence_enabled
              then:
                - script.execute: minute_of_silence
    on_time_sync:
      then:
        - script.execute: refresh_clock
        - script.execute: refresh_slot
        - script.execute: refresh_face

  # The face is a clock, and until now the only thing that could set it was Home
  # Assistant -- so a unit that rebooted while HA was down showed dashes forever.
  # SNTP writes the same system clock, so id(ha_time) reads valid either way;
  # whichever source answers first wins and the other simply confirms it.
  - platform: sntp
    id: net_time
    on_time_sync:
      then:
        - script.execute: refresh_clock
        - script.execute: refresh_slot
        - script.execute: refresh_face

lvgl:
  displays:
    - htram_display
  # No `rotation:` here on purpose -- the 180 degree turn now lives in the
  # ST7789's MADCTL register on the GD32 (LCD_MADCTL in display.c), so the
  # GD32's own boot and standby screens come out upright as well and LVGL
  # stops rotating every flushed rectangle in software.
  buffer_size: 12.5%
  byte_order: big_endian
  bg_color: 0x000000
  refresh_interval: 200ms
  widgets:
    - obj:
        id: ui_root
        width: 240
        height: 240
        pad_all: 0
        border_width: 0
        outline_width: 0
        bg_color: 0x000000
        bg_opa: cover
        scrollable: false
        widgets:
          # A swept arc looked right but cost 8.9 s of UART once a minute: at the
          # 59->0 wrap LVGL invalidates the whole 214x214 ring at once, and at
          # 115200 that is a two-thirds-of-a-screen repaint. Measured on the
          # device as "lvgl took a long time for an operation (8853 ms)".
          #
          # So the ring is now a static outline that is drawn once and never
          # touched, and the seconds are a dot orbiting it. The wrap becomes
          # just another 7 px move, and the whole thing costs ~40 ms/s.
          - obj:
              id: ui_ring
              align: center
              width: 228
              height: 228
              radius: 114
              bg_opa: TRANSP
              border_width: 2
              border_color: 0xB9AFA3
              border_opa: 30%
              pad_all: 0
              scrollable: false
              clickable: false

          - obj:
              id: ui_secdot
              x: 116
              y: 3
              width: 7
              height: 7
              radius: 4
              bg_color: 0xB9AFA3
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false

          # Staggered +/-16 px. The clock face carries tight vertical metrics
          # (ascender clamped to the digits), so the line box is 67 px rather
          # than 102 and y addresses the ink directly — which also stops the two
          # rows overlapping, so LVGL no longer merges them into one repaint.
          # One label per digit. Only the digit that actually changed is
          # invalidated, so nine minutes out of ten the repaint is a single
          # 59x70 box instead of the whole 118 px pair.
          #
          # 92 px is the ceiling while the date stays inside the ring: the
          # hours row needs 82 px of half-width (pair + stagger + the oblique's
          # overhang) and the circle only offers that from y=44 down.
          - label:
              id: ui_h1
              align: top_mid
              x: -46
              y: 44
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"
          - label:
              id: ui_h2
              align: top_mid
              x: 14
              y: 44
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"
          - label:
              id: ui_m1
              align: top_mid
              x: -14
              y: 120
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"
          - label:
              id: ui_m2
              align: top_mid
              x: 46
              y: 120
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"

          - label:
              id: ui_devid
              align: center
              y: 4
              text_font: font_id
              text_color: 0xF0EAE0
              text: ""
              hidden: true

          - label:
              id: ui_devid_cap
              align: center
              y: -34
              text_font: font_slot
              text_color: 0x707880
              text: "ID"
              hidden: true

          # The QR's quiet zone: lv_qrcode paints the light colour only under
          # the modules themselves, and a code that runs straight into black
          # pixels does not scan.
          - obj:
              id: ui_ap_card
              align: center
              y: -14
              width: 140
              height: 140
              radius: 6
              bg_color: 0xFFFFFF
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true

          - qrcode:
              id: ui_ap_qr
              align: center
              y: -14
              size: 124
              dark_color: 0x000000
              light_color: 0xFFFFFF
              hidden: true

          # Shown only when the clock cannot be: these replace the digits rather
          # than sharing the face with them. Four slots, because the AP face has
          # to label two Latin strings that mean nothing on their own -- the
          # network name and its password. Positions are set at runtime by
          # refresh_face, since a two-line face and a four-line face cannot
          # share one set of offsets.
          - image:
              id: ui_tryzub
              align: center
              src: img_tryzub
              hidden: true

          - label:
              id: ui_msg_cap
              align: center
              y: -56
              text_font: font_slot
              text_color: 0x707880
              text: ""
              hidden: true

          - label:
              id: ui_msg
              align: center
              y: -6
              text_font: font_msg
              text_color: 0xC2C8D0
              text: ""
              hidden: true

          - label:
              id: ui_msg_sub
              align: center
              y: 22
              text_font: font_slot
              text_color: 0x707880
              text: ""
              hidden: true

          - label:
              id: ui_msg2
              align: center
              y: 30
              text_font: font_msg
              text_color: 0xC2C8D0
              text: ""
              hidden: true

          - label:
              id: ui_slot
              align: bottom_mid
              y: -25
              text_font: font_slot
              text_color: 0xC2C8D0
              text: ""

          - label:
              id: ui_pocket
              align: top_right
              x: -64
              y: 70
              text_font: font_slot
              text_color: 0xFF9E3D
              text: ""

          # Battery, drawn rather than written. Sits in the pocket the stagger
          # of the hours leaves free, and stays hidden while on USB.
          - obj:
              id: ui_batt_body
              x: 166
              y: 54
              width: 22
              height: 11
              radius: 2
              bg_opa: TRANSP
              border_width: 1
              border_color: 0x707880
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true
          - obj:
              id: ui_batt_nub
              x: 188
              y: 57
              width: 2
              height: 5
              radius: 0
              bg_color: 0x707880
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true
          - obj:
              id: ui_batt_fill
              x: 168
              y: 56
              width: 12
              height: 7
              radius: 0
              bg_color: 0x707880
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true

sensor:
  - platform: debug
    free:
      name: "Free heap"
    block:
      name: "Largest free block"
    loop_time:
      name: "Loop time"

  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 30s
  - platform: uptime
    name: "Uptime"

  # Outdoor temperature for the middle slot position — the one thing the smart
  # home adds that the device could never know by itself.
  - platform: homeassistant
    id: outdoor_temp
    entity_id: ${weather_entity}
    attribute: temperature
    on_value:
      - lambda: if (id(slot_idx) == 1) id(refresh_slot).execute();

  - platform: htram_gd32
    co2:
      name: "CO2"
      id: sensor_co2
      on_value:
        - script.execute: refresh_leds
    temperature:
      name: "Temperature"
      id: sensor_temp
      on_value:
        - lambda: if (id(slot_idx) == 2) id(refresh_slot).execute();
    humidity:
      name: "Humidity"
      id: sensor_hum
      on_value:
        - lambda: if (id(slot_idx) == 2) id(refresh_slot).execute();
    battery:
      name: "Battery Voltage"
      id: sensor_batt_mv
    battery_level:
      name: "Battery"
      id: sensor_batt_level
      on_value:
        - script.execute: refresh_pocket

binary_sensor:
  - platform: htram_gd32
    usb:
      name: "USB Power"
      id: sensor_usb
      on_state:
        - script.execute: refresh_pocket
    charging:
      name: "Charging"
      id: sensor_chrg
    button:
      name: "Button"
      id: htram_button

text_sensor:
  - platform: debug
    device:
      name: "Device info"
    reset_reason:
      name: "Reset reason"

  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic

  - platform: version
    name: "ESPHome Version"
  - platform: template
    id: device_id
    name: "Device ID"
    icon: "mdi:identifier"
    entity_category: diagnostic
  - platform: homeassistant
    id: outdoor_cond
    entity_id: ${weather_entity}
    on_value:
      - lambda: if (id(slot_idx) == 1) id(refresh_slot).execute();
  - platform: htram_gd32
    firmware_version:
      name: "GD32 Firmware"
      entity_category: diagnostic
    button_action:
      name: "Button Action"
      on_value:
        # On the AP face a single click turns the page, and stops the rotation
        # so the credentials stay put for as long as it takes to type them.
        - if:
            condition:
              lambda: return x == "single" && id(face_state) == 3;
            then:
              - lambda: |-
                  id(ap_manual) = true;
                  id(ap_page) ^= 1;
                  id(face_state) = -1;
              - script.execute: refresh_face
        - if:
            condition:
              lambda: return x == "double";
            then:
              - script.execute: show_network
        - if:
            condition:
              lambda: return x == "triple";
            then:
              - script.execute: show_device_id

button:
  - platform: template
    name: "Show Device ID"
    icon: "mdi:identifier"
    entity_category: diagnostic
    on_press:
      - script.execute: show_device_id

  # Otherwise this feature is observable once a day, at nine, and only ever
  # tomorrow. Diagnostic rather than a normal control: it is for checking that
  # the thing works, not for holding minutes of silence on demand.
  - platform: template
    name: "Хвилина мовчання: перевірка"
    icon: "mdi:candle"
    entity_category: diagnostic
    on_press:
      - script.execute: minute_of_silence

  - platform: template
    name: "Beep"
    icon: "mdi:volume-high"
    on_press:
      - lambda: |-
          id(htram_core)->send_beep(2000, 200);

number:
  - platform: template
    name: "Screen Brightness"
    id: screen_brightness
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    set_action:
      - lambda: |-
          id(htram_core)->send_backlight(x);

switch:
  # LED state is authoritative on the GD32 (it lights green at boot and mirrors
  # its real state back over telemetry); DISABLED restore keeps the ESP from
  # overriding it on connect.
  - platform: htram_gd32
    red:
      name: "LED Red"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    yellow:
      name: "LED Yellow"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    green:
      name: "LED Green"
      icon: "mdi:led-on"
      restore_mode: DISABLED

  - platform: template
    name: "Хвилина мовчання"
    id: silence_enabled
    icon: "mdi:candle"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "LED Auto"
    icon: "mdi:television-ambient-light"
    lambda: return id(led_auto);
    turn_on_action:
      - lambda: id(led_auto) = true;
      - script.execute: refresh_leds
    turn_off_action:
      - lambda: id(led_auto) = false;
    restore_mode: RESTORE_DEFAULT_ON
