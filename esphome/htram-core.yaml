substitutions:
  name: htram
  # Якщо назва задається для кожного пристрою окремо (GitOps), суфікс вимикається.
  # Вмикайте лише якщо всі пристрої шиються з одного конфігу без власного name.
  name_add_mac_suffix: "false"
  friendly_name: HTRAM
  # Базовий URL для шрифтів та зображень (GitOps)
  repo_url: "https://raw.githubusercontent.com/reidMaks/htram-esphome/main/esphome"
  # Сигнал після успішної прошивки (короткий висхідний тризвук a6, b6, c7 у резонансній смузі динаміка)
  ota_done_rtttl: "Flashed:d=16,o=6,b=240:a,b,c7"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Several of these are going to live in the same house, and they are all
  # flashed from this one config. The MAC suffix keeps their hostnames and
  # entity ids apart without a per-device file. Drop this line to go back to a
  # plain "htram".
  name_add_mac_suffix: ${name_add_mac_suffix}
  on_boot:
    - priority: 600
      then:
        - text_sensor.template.publish:
            id: device_id
            state: !lambda "return esphome::get_mac_address().substr(6);"
    # LVGL builds its widget tree in setup(), so anything that touches ui_* has
    # to wait until every component is up.
    - priority: -100
      then:
        - lambda: "id(htram_arbiter_hub)->set_core(id(htram_core));"
        - script.execute: refresh_leds
        - script.execute: refresh_face
        - script.execute: check_flash_chime

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

logger:
  baud_rate: 115200

api:
  encryption:
    key: !secret api_key
  services:
    - service: beep
      variables:
        freq: int
        dur: int
      then:
        - lambda: |-
            id(htram_core)->send_beep(freq, dur);

    - service: set_backlight
      variables:
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_backlight(brightness);

    - service: set_leds
      variables:
        r: int
        y: int
        g: int
        brightness: int
      then:
        - lambda: |-
            id(htram_core)->send_leds(r, y, g, brightness);

    - service: enter_bootloader
      then:
        - lambda: |-
            id(htram_core)->send_enter_bootloader();

    - service: play_rtttl
      variables:
        song: string
      then:
        - lambda: |-
            id(htram_core)->play_rtttl(song);

    - service: stop_melody
      then:
        - lambda: |-
            id(htram_core)->send_stop();

    - service: inject_button
      variables:
        action: string
      then:
        - lambda: |-
            id(htram_arbiter_hub)->dispatch_button_action(action);

    - service: inject_event
      variables:
        event: string
      then:
        - lambda: |-
            id(htram_arbiter_hub)->dispatch_event(event);

ota:
  - platform: esphome
    password: !secret ota_password
    # The ESP's own update is the longer of the two blackouts: about eight
    # seconds during which the panel keeps its last frame, because the GD32
    # gets nothing to draw. The GD32 update signals itself from firmware, but
    # nothing covered this one -- and a person watching a frozen screen for
    # eight seconds is exactly who reaches for the cable.
    #
    # All three at once is a combination the CO2 logic never produces. No
    # restore needed: the ESP reboots into a fresh state and refresh_leds puts
    # the real colour back.
    on_begin:
      then:
        - lambda: "id(htram_core)->send_leds(1, 1, 1, 1);"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    # The fallback AP is the only way into a unit that cannot reach the house
    # network, and web_server sits behind it with full control of the device.
    # An open AP hands that to anyone within radio range.
    password: !secret ap_password

captive_portal:


# Скільки пам'яті лишається під навантаженням, і чому саме перезавантажився.
debug:
  update_interval: 30s

web_server:
  port: 80
  # Reachable from the whole LAN, and from anyone on the fallback AP. Digest
  # rather than basic: the password never crosses the wire in a reversible form.
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

external_components:
  - source:
      type: local
      path: custom_components
    components: [htram_gd32, htram_arbiter]

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  # 921600 since the GD32 stopped blocking its main loop for longer than the
  # 2 KB RX ring can absorb (SHT30 split in two, CO2 poll behind flow control).
  # The resident flasher inherits USART1_BAUD from the firmware, so GD32 OTA
  # runs at this speed too.
  baud_rate: 921600

htram_gd32:
  id: htram_core
  uart_id: uart_bus

htram_arbiter:
  id: htram_arbiter_hub
  events:
    - event: button_single
      context: clock
      priority: 10
      name: core_cycle_slot
      then:
        - lambda: |-
            int max_slots = id(slot_extra_text).empty() ? 2 : 3;
            id(slot_idx) = (id(slot_idx) + 1) % max_slots;
            id(refresh_slot).execute();
    - event: button_triple
      context: clock
      priority: 10
      name: core_show_net
      then:
        - script.execute: show_network
    - event: button_single
      context: modal_ap
      priority: 100
      name: core_toggle_ap_page
      then:
        - lambda: |-
            id(ap_manual) = true;
            id(ap_page) ^= 1;
            id(face_state) = -1;
        - script.execute: refresh_face
    - event: button_single
      context: modal_overlay
      priority: 100
      name: core_dismiss_overlay
      then:
        - lambda: id(slot_hold) = false;
        - script.execute: refresh_face

display:
  - platform: htram_gd32
    id: htram_display
    update_interval: never

font:
  # Digits only, and pre-slanted: ESPHome renders from the TTF at build time and
  # LVGL has no shear, so the 12 deg oblique is baked into the file by
  # tools/fonts/make_oblique.py. 4 bpp matters here — the ExtraLight stem is
  # 5 px wide and 1 bpp would shred it.
  - file: "${repo_url}/fonts/DejaVuSans-ExtraLight-Oblique.ttf"
    id: font_clock
    size: 92
    bpp: 4
    glyphs: "0123456789-"

  # Sixteen glyphs, for the one thing that is read deliberately rather than
  # glanced at: the device id, shown big enough to read across a desk.
  - file: "${repo_url}/fonts/NotoSans-Regular.ttf"
    id: font_id
    size: 44
    bpp: 4
    glyphs: "0123456789abcdef"

  # The caption line stays upright, and in a regular weight: measured at 15 px,
  # ExtraLight has a 1 px stem that never reaches full white (peak 240/255),
  # while Noto Sans gets 2 px at 255. Going bigger does not fix it -- ExtraLight
  # is still 1 px at 17 px -- so this is about weight, not size.
  - file: "${repo_url}/fonts/NotoSans-Regular.ttf"
    id: font_slot
    size: 15
    bpp: 4
    glyphs: "0123456789.,:%-+ °"
    glyphsets:
      - GF_Cyrillic_Core

  # 22 px UI font: used for failure screens, fallback AP credentials,
  # weather forecast date & temperatures, and feature titles.
  # Includes ASCII, Latin, degree symbol, and full Ukrainian alphabet.
  - file: "${repo_url}/fonts/NotoSans-Regular.ttf"
    id: font_msg
    size: 22
    bpp: 4
    glyphs: " !#$%&()*+,-.:;=?@[]_{}~/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯабвгґдеєжзиіїйклмнопрстуфхцчшщьюя"


globals:
  - id: ha_link
    type: bool
    restore_value: false
    initial_value: "false"
  - id: slot_idx
    type: int
    restore_value: false
    initial_value: "0"
  - id: slot_hold
    type: bool
    restore_value: false
    initial_value: "false"
  - id: slot_extra_text
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: led_auto
    type: bool
    restore_value: true
    initial_value: "true"

  # Температура так, як її прислав GD32, до підстроювання нижче: фільтр
  # вологості рахує від неї. У телеметрії T публікується перед RH з того
  # самого пакета, тож на момент фільтра RH значення свіже.
  - id: t_from_gd32
    type: float
    restore_value: false
    initial_value: "NAN"
  # 0 = clock, 1 = no time, 2 = no network, -1 = unknown/overlay dirtied it.
  # lv_label_set_text invalidates unconditionally, so the message is only
  # written when the state behind it actually changed.
  - id: face_state
    type: int
    restore_value: false
    initial_value: "-1"
  # The AP face has two pages: 0 = QR to scan, 1 = the same credentials as text.
  - id: ap_page
    type: int
    restore_value: false
    initial_value: "0"
  # Set by the first button press on the AP face. Until then the two pages
  # alternate on their own, which is what makes the second one discoverable;
  # afterwards the button owns them, because seven seconds is not enough to
  # copy a password and a timer that takes it away mid-word is hostile.
  - id: ap_manual
    type: bool
    restore_value: false
    initial_value: "false"
  # Відстеження перепрошивки: хеш дати/часу збірки зберігається в NVS.
  # Якщо поточний білд відрізняється — це перше завантаження після прошивки.
  - id: last_boot_build_hash
    type: int
    restore_value: true
    initial_value: "0"

script:
  # Сигнал після першого завантаження свіжої прошивки:
  - id: check_flash_chime
    then:
      - delay: 1s
      - lambda: |-
          const uint32_t current_hash = esphome::fnv1_hash(__DATE__ " " __TIME__);
          if (id(last_boot_build_hash) != (int) current_hash) {
            id(last_boot_build_hash) = (int) current_hash;
            ESP_LOGI("htram", "First boot after firmware flash (build: %s %s)!", __DATE__, __TIME__);
            id(htram_core)->play_rtttl("${ota_done_rtttl}");
          }

  # Hours and minutes are separate labels: only the minutes row is dirty most of
  # the time, and staggering them needs independent x offsets anyway.
  - id: refresh_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) now = id(net_time).now();
          if (!now.is_valid()) {
            time_t t = ::time(nullptr);
            if (t > 1700000000) now = esphome::ESPTime::from_epoch_local(t);
          }
          if (!now.is_valid()) return;
          // lv_label_set_text invalidates unconditionally, so each digit is
          // written only when it actually changed.
          static int prev[4] = {-1, -1, -1, -1};
          static int last_face = -1;
          if (id(face_state) != last_face) {
            last_face = id(face_state);
            prev[0] = prev[1] = prev[2] = prev[3] = -1;
          }
          const int cur[4] = {now.hour / 10, now.hour % 10,
                              now.minute / 10, now.minute % 10};
          lv_obj_t *const lbl[4] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2)};
          char buf[2] = {0, 0};
          for (int i = 0; i < 4; i++) {
            const char *existing = lv_label_get_text(lbl[i]);
            if (cur[i] == prev[i] && existing != nullptr && existing[0] == ('0' + cur[i])) continue;
            prev[i] = cur[i];
            buf[0] = '0' + cur[i];
            lv_label_set_text(lbl[i], buf);
          }

  # One caption line, three facts, rotating every 7 s.
  # Which unit am I looking at? Triple-click and the caption says so for a few
  # seconds, then goes back to its rotation. Nothing permanent is added to the
  # face for something you need about twice a year.
  - id: show_device_id
    mode: restart
    then:
      - script.stop: show_network
      - lambda: |-
          /* Identifying a unit is a deliberate act, not a glance, so it takes
             over the whole face rather than whispering from the caption line
             at 1.7 mm. The clock comes back six seconds later. */
          id(slot_hold) = true;
          id(face_state) = -1;
          std::string s = esphome::get_mac_address().substr(6);
          lv_label_set_text(id(ui_devid), s.c_str());
          std::string ip = id(wifi_ip).state;
          if (ip.empty() || ip == "0.0.0.0") ip = "немає мережі";
          lv_label_set_text(id(ui_msg_sub), ip.c_str());
          lv_obj_align(id(ui_msg_sub), LV_ALIGN_CENTER, 0, 48);
          lv_obj_t *const hide[] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2),
                                    id(ui_slot), id(ui_pocket), id(ui_msg),
                                    id(ui_msg_cap), id(ui_msg2),
                                    id(ui_ap_card), id(ui_ap_qr)};
          for (auto *o : hide) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_devid), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_devid_cap), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
      - delay: 6s
      - lambda: |-
          lv_obj_add_flag(id(ui_devid), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(ui_devid_cap), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_pocket), LV_OBJ_FLAG_HIDDEN);
          id(slot_hold) = false;
      - script.execute: refresh_face
      - script.execute: refresh_clock
      - script.execute: refresh_slot
      - script.execute: refresh_pocket

  # A clock with no time is dashes, and dashes look like a broken screen rather
  # than an explanation. Whenever the time is not set, the face says why instead.
  # A working clock is never hidden: losing the network while the time is
  # already known leaves the clock alone and speaks through the pocket and slot.
  - id: refresh_face
    then:
      - lambda: |-
          if (id(slot_hold)) return;  // the ID / IP overlay owns the face

          // The fallback AP is the only state where the device is actively
          // asking for help and can do nothing else useful -- no HA, no
          // weather, nothing. So it outranks even a valid clock.
          const bool ap = captive_portal::global_captive_portal != nullptr &&
                          captive_portal::global_captive_portal->is_active();
          const bool net = wifi::global_wifi_component->is_connected();
          const bool have_time = id(ha_time).now().is_valid() ||
                                 id(net_time).now().is_valid() ||
                                 (::time(nullptr) > 1700000000);

          // Priority, as written down in TODO §13: the AP outranks everything
          // (a device asking to be configured can do nothing else useful), then
          // the minute of silence, then the ordinary faces.
          const bool silence = id(htram_arbiter_hub)->is_silence_active();
          const int want = ap ? 3 : (silence ? 4 : (have_time ? 0 : (net ? 1 : 2)));
          if (want != 3) id(ap_manual) = false;
          const int prev_face = id(face_state);
          if (want == prev_face) return;
          id(face_state) = want;
          if (prev_face == 4 && want != 4) {
            lv_obj_invalidate(id(ui_root));
          }

          lv_obj_t *const face[] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2),
                                    id(ui_slot)};
          for (auto *o : face) {
            if (want == 0) {
              lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
              lv_obj_invalidate(o);
            } else {
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            }
          }

          lv_obj_t *const msg[] = {id(ui_msg_cap), id(ui_msg), id(ui_msg_sub),
                                   id(ui_msg2), id(ui_ap_card), id(ui_ap_qr)};
          for (auto *o : msg) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);

          id(on_face_changed).execute(want);

          lv_obj_set_style_bg_color(id(ui_root), lv_color_hex(0x000000), LV_PART_MAIN);
          if (want != 4) {
            lv_obj_set_style_bg_color(id(ui_secdot), lv_color_hex(0xB9AFA3), LV_PART_MAIN);
          }

          if (want == 4) {
            return;
          }

          if (want == 0) {
            id(refresh_clock).execute();
            id(refresh_slot).execute();
            return;
          }

          if (want == 3) {
            // Both strings come from the running config rather than being
            // repeated here, so they cannot drift from what the radio answers.
            auto cfg = wifi::global_wifi_component->get_ap();
            const std::string ssid = cfg.get_ssid().c_str();
            const std::string pass = cfg.get_password().c_str();

            lv_label_set_text(id(ui_msg_cap), "точка доступу");
            lv_obj_align(id(ui_msg_cap), LV_ALIGN_CENTER, 0,
                         id(ap_page) == 0 ? 76 : -62);
            lv_obj_remove_flag(id(ui_msg_cap), LV_OBJ_FLAG_HIDDEN);

            if (id(ap_page) == 0) {
              // The whole join, in one scan. The modules land at ~0.55 mm on a
              // 27 mm panel, which is close to what a phone camera resolves --
              // hence page 1, which is the same credentials typed out.
              const std::string qr = "WIFI:T:WPA;S:" + ssid + ";P:" + pass + ";;";
              lv_qrcode_update(id(ui_ap_qr), qr.c_str(), qr.size());
              lv_obj_remove_flag(id(ui_ap_card), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(ui_ap_qr), LV_OBJ_FLAG_HIDDEN);
              return;
            }

            lv_label_set_text(id(ui_msg), ssid.c_str());
            lv_obj_align(id(ui_msg), LV_ALIGN_CENTER, 0, -30);
            lv_label_set_text(id(ui_msg_sub), "пароль");
            lv_obj_align(id(ui_msg_sub), LV_ALIGN_CENTER, 0, 4);
            lv_label_set_text(id(ui_msg2), pass.c_str());
            lv_obj_align(id(ui_msg2), LV_ALIGN_CENTER, 0, 34);
            lv_obj_remove_flag(id(ui_msg), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(ui_msg2), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          lv_label_set_text(id(ui_msg), net ? "немає часу" : "немає мережі");
          lv_obj_align(id(ui_msg), LV_ALIGN_CENTER, 0, -14);
          lv_label_set_text(id(ui_msg_sub),
                            net ? "чекаю сервер часу" : "шукаю мережу");
          lv_obj_align(id(ui_msg_sub), LV_ALIGN_CENTER, 0, 16);
          lv_obj_remove_flag(id(ui_msg), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);

  # Double-click: the address, for the six seconds it takes to type it in.
  # Same deliberate-act reasoning as the device id -- nothing permanent on the
  # face for something needed twice a year, but reachable without a router UI.
  - id: show_network
    mode: restart
    then:
      - script.stop: show_device_id
      - lambda: |-
          id(slot_hold) = true;
          id(face_state) = -1;
          std::string ip = id(wifi_ip).state;
          if (ip.empty() || ip == "0.0.0.0") ip = "немає мережі";
          lv_label_set_text(id(ui_msg_cap), "адреса");
          lv_obj_align(id(ui_msg_cap), LV_ALIGN_CENTER, 0, -24);
          lv_label_set_text(id(ui_msg), ip.c_str());
          lv_obj_align(id(ui_msg), LV_ALIGN_CENTER, 0, 2);
          lv_obj_add_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_msg_cap), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *const hide[] = {id(ui_h1), id(ui_h2), id(ui_m1), id(ui_m2),
                                    id(ui_slot), id(ui_pocket), id(ui_devid),
                                    id(ui_devid_cap), id(ui_msg2),
                                    id(ui_ap_card), id(ui_ap_qr)};
          for (auto *o : hide) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_msg), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
      - delay: 6s
      - lambda: id(slot_hold) = false;
      - script.execute: refresh_face
      - script.execute: refresh_clock
      - script.execute: refresh_slot
      - script.execute: refresh_pocket

  # Точки розширення для модульних функцій (features)
  - id: on_face_changed
    parameters:
      face: int
    then: []

  - id: on_alert_changed
    then: []

  - id: handle_feature_button
    parameters:
      action: string
    then: []

  - id: on_alarm_started
    then: []

  - id: on_alarm_dismissed
    then: []

  - id: on_button_press
    then:
      - lambda: |-
          id(htram_arbiter_hub)->dispatch_event("button_press");

  - id: on_button_release
    then:
      - lambda: |-
          id(htram_arbiter_hub)->dispatch_event("button_release");

  - id: on_button_action
    mode: restart
    parameters:
      action: string
    then:
      - lambda: |-
          id(htram_arbiter_hub)->dispatch_button_action(action);

  - id: refresh_slot
    then:
      - lambda: |-
          if (id(slot_hold)) return;
          char buf[48];
          if (!id(slot_extra_text).empty() && id(slot_idx) == 2) {
            snprintf(buf, sizeof(buf), "%s", id(slot_extra_text).c_str());
          } else {
            switch (id(slot_idx)) {
            case 0: {
              auto now = id(ha_time).now();
              if (!now.is_valid()) now = id(net_time).now();
              if (!now.is_valid()) {
                time_t t = ::time(nullptr);
                if (t > 1700000000) now = esphome::ESPTime::from_epoch_local(t);
              }
              if (!now.is_valid()) return;
              static const char *const DAYS[] = {"", "Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"};
              // Three letters, not the full month: "Пн, 22 листопада" is 138 px
              // and the content circle only offers 117 px at this baseline.
              static const char *const MONTHS[] = {
                  "", "січ", "лют", "бер", "кві", "тра", "чер",
                  "лип", "сер", "вер", "жов", "лис", "гру"};
              snprintf(buf, sizeof(buf), "%s, %d %s",
                       DAYS[now.day_of_week >= 1 && now.day_of_week <= 7 ? now.day_of_week : 0],
                       now.day_of_month,
                       MONTHS[now.month >= 1 && now.month <= 12 ? now.month : 0]);
              break;
            }
            default: {
              if (isnan(id(sensor_temp).state) || isnan(id(sensor_hum).state)) return;
              snprintf(buf, sizeof(buf), "%.1f°  %.0f%%",
                       id(sensor_temp).state, id(sensor_hum).state);
              break;
            }
          }
          }
          lv_label_set_text(id(ui_slot), buf);

  # The pocket is empty whenever nothing needs the eye. Percentage rather than a
  # battery glyph: at 1.8 mm a glyph is mush and "62%" is not.
  - id: refresh_pocket
    then:
      - lambda: |-
          // Charge level and API link are independent facts, so they no longer
          // gate each other: coupling them meant every gap between API clients
          // (an `esphome logs` session ending counts) hid the battery.
          const bool warn = !id(ha_link);
          const bool on_batt = !id(sensor_usb).state &&
                               !isnan(id(sensor_batt_level).state);

          ESP_LOGD("pocket", "link=%d usb=%d batt=%.0f -> warn=%d batt_icon=%d",
                   (int) id(ha_link), (int) id(sensor_usb).state,
                   id(sensor_batt_level).state, (int) warn, (int) on_batt);

          lv_label_set_text(id(ui_pocket), warn ? "!" : "");

          lv_obj_t *const batt[3] = {id(ui_batt_body), id(ui_batt_nub), id(ui_batt_fill)};
          for (int i = 0; i < 3; i++) {
            if (on_batt)
              lv_obj_remove_flag(batt[i], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(batt[i], LV_OBJ_FLAG_HIDDEN);
          }
          if (!on_batt) return;

          const float pct = id(sensor_batt_level).state;
          const uint32_t c = pct < 20 ? 0xFF9E3D : 0x9AA2AC;
          int w = (int) lroundf(18.0f * (pct < 0 ? 0 : (pct > 100 ? 100 : pct)) / 100.0f);
          if (w < 1) w = 1;
          lv_obj_set_width(id(ui_batt_fill), w);
          lv_obj_set_style_bg_color(id(ui_batt_fill), lv_color_hex(c), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(ui_batt_nub), lv_color_hex(c), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(ui_batt_body), lv_color_hex(c), LV_PART_MAIN);

  # CO2 moved off the screen and onto the LEDs above it, so they have to
  # actually track it now.
  - id: refresh_leds
    then:
      - lambda: |-
          if (!id(led_auto)) return;
          if (id(htram_arbiter_hub)->get_led_priority() > 10) return;
          // The GD32 lights green at boot to say "I am alive", and the NDIR
          // needs minutes before it has a number. Leaving that green up meant
          // the device asserted clean air while it had measured nothing at all,
          // which is the one claim it must never make on faith.
          if (isnan(id(sensor_co2).state)) {
            id(htram_arbiter_hub)->set_leds(10, "co2", 0, 0, 0, 0);
            return;
          }
          uint16_t ppm = (uint16_t) id(sensor_co2).state;
          id(htram_arbiter_hub)->set_leds(10, "co2", ppm >= 1500, ppm >= 1000 && ppm < 1500, ppm < 1000, 0);

interval:
  # High-frequency tick (20ms) for sub-20ms multi-room audio & LCD second synchronization.
  - interval: 20ms
    then:
      - lambda: |-
          static int last_ui_sec = -1;
          static int last_min = -1;
          if (id(htram_core)->consume_display_refresh()) {
            last_ui_sec = -1;
            last_min = -1;
            id(face_state) = -1;
            id(refresh_face).execute();
            lv_obj_invalidate(lv_screen_active());
          }
          if (id(htram_core)->is_ota_mode()) return;

          timeval tv;
          gettimeofday(&tv, nullptr);
          auto now = id(ha_time).now();
          if (!now.is_valid()) now = id(net_time).now();
          if (!now.is_valid()) {
            time_t t = ::time(nullptr);
            if (t > 1700000000) now = esphome::ESPTime::from_epoch_local(t);
          }
          if (!now.is_valid()) return;

          // Exact-second LCD updates (orbiting seconds dot & clock minute flip)
          if ((int) tv.tv_sec != last_ui_sec) {
            last_ui_sec = (int) tv.tv_sec;
            // Moving the dot invalidates only where it was and where it lands.
            float a = (now.second * 6.0f - 90.0f) * 3.14159265f / 180.0f;
            lv_obj_set_pos(id(ui_secdot),
                           (lv_coord_t) lroundf(120.0f + 113.0f * cosf(a) - 3.5f),
                           (lv_coord_t) lroundf(120.0f + 113.0f * sinf(a) - 3.5f));
            if (now.minute != last_min) {
              last_min = now.minute;
              id(refresh_clock).execute();
              if (id(slot_idx) == 0) id(refresh_slot).execute();
            }
          }

          // Initial boot resync: at ~1.5s after boot (when GD32 UART link is confirmed up),
          // force a clean repaint of face and digits so boot glitches/drops are cleared immediately.
          static bool boot_synced = false;
          if (!boot_synced && millis() > 1500) {
            boot_synced = true;
            last_min = -1;
            id(face_state) = -1;
            id(refresh_face).execute();
            lv_obj_invalidate(lv_screen_active());
          }

  # A GD32 that has just restarted spent its first ~700 ms with no USART1,
  # so the top of our last frame and every command we sent in that window
  # were dropped on the floor -- which is why a standby wake used to leave
  # a strip of the GD32's own boot screen across the top of the face, in
  # the one band LVGL never invalidates again. It tells us when it is ready
  # now; everything it missed goes out again here.
  - interval: 1s
    then:
      - lambda: |-
          if (id(htram_core)->consume_gd32_boot()) {
            ESP_LOGI("resync", "GD32 restarted: full repaint + LED/backlight resend");
            id(htram_core)->send_backlight((uint8_t) id(screen_brightness).state);
            id(htram_core)->resend_leds();
            id(face_state) = -1;          // the face may be stale as well
            id(refresh_face).execute();
            id(refresh_leds).execute();   // auto mode overrides the resend
            lv_obj_invalidate(lv_screen_active());
          }

  - interval: 7s
    then:
      - lambda: |-
          if (id(htram_core)->is_ota_mode()) return;
          int max_slots = id(slot_extra_text).empty() ? 2 : 3;
          id(slot_idx) = (id(slot_idx) + 1) % max_slots;
          id(refresh_slot).execute();
      # Same rhythm flips the AP face between the QR and the typed credentials,
      # until somebody takes the wheel with the button.
      - lambda: |-
          if (id(htram_core)->is_ota_mode()) return;
          if (id(face_state) == 3 && !id(ap_manual)) {
            id(ap_page) ^= 1;
            id(face_state) = -1;   // force refresh_face to repaint
            id(refresh_face).execute();
          }

  # Polled, not edge-tracked: on_client_disconnected fires whenever any client
  # leaves, so a passing `esphome logs` session used to latch the warning on.
  - interval: 5s
    then:
      - if:
          condition: api.connected
          then:
            - lambda: |-
                if (!id(ha_link)) { id(ha_link) = true; id(refresh_pocket).execute(); }
          else:
            - lambda: |-
                if (id(ha_link)) { id(ha_link) = false; id(refresh_pocket).execute(); }
      - script.execute: refresh_face

time:
  - platform: homeassistant
    id: ha_time
    timezone: "Europe/Kyiv"
    on_time_sync:
      then:
        - lambda: id(face_state) = -1;
        - script.execute: refresh_face
        - script.execute: refresh_clock
        - script.execute: refresh_slot

  # The face is a clock, and until now the only thing that could set it was Home
  # Assistant -- so a unit that rebooted while HA was down showed dashes forever.
  # SNTP writes the same system clock, so id(ha_time) reads valid either way;
  # whichever source answers first wins and the other simply confirms it.
  - platform: sntp
    id: net_time
    timezone: "Europe/Kyiv"
    on_time_sync:
      then:
        - lambda: id(face_state) = -1;
        - script.execute: refresh_face
        - script.execute: refresh_clock
        - script.execute: refresh_slot

lvgl:
  displays:
    - htram_display
  # No `rotation:` here on purpose -- the 180 degree turn now lives in the
  # ST7789's MADCTL register on the GD32 (LCD_MADCTL in display.c), so the
  # GD32's own boot and standby screens come out upright as well and LVGL
  # stops rotating every flushed rectangle in software.
  buffer_size: 12.5%
  byte_order: big_endian
  bg_color: 0x000000
  refresh_interval: 200ms
  widgets:
    - obj:
        id: ui_root
        width: 240
        height: 240
        pad_all: 0
        border_width: 0
        outline_width: 0
        bg_color: 0x000000
        bg_opa: cover
        scrollable: false
        widgets:
          # A swept arc looked right but cost 8.9 s of UART once a minute: at the
          # 59->0 wrap LVGL invalidates the whole 214x214 ring at once, and at
          # 115200 that is a two-thirds-of-a-screen repaint. Measured on the
          # device as "lvgl took a long time for an operation (8853 ms)".
          #
          # So the ring is now a static outline that is drawn once and never
          # touched, and the seconds are a dot orbiting it. The wrap becomes
          # just another 7 px move, and the whole thing costs ~40 ms/s.
          - obj:
              id: ui_ring
              align: center
              width: 228
              height: 228
              radius: 114
              bg_opa: TRANSP
              border_width: 2
              border_color: 0xB9AFA3
              border_opa: 30%
              pad_all: 0
              scrollable: false
              clickable: false

          - obj:
              id: ui_secdot
              x: 116
              y: 3
              width: 7
              height: 7
              radius: 4
              bg_color: 0xB9AFA3
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false

          # Staggered +/-16 px. The clock face carries tight vertical metrics
          # (ascender clamped to the digits), so the line box is 67 px rather
          # than 102 and y addresses the ink directly — which also stops the two
          # rows overlapping, so LVGL no longer merges them into one repaint.
          # One label per digit. Only the digit that actually changed is
          # invalidated, so nine minutes out of ten the repaint is a single
          # 59x70 box instead of the whole 118 px pair.
          #
          # 92 px is the ceiling while the date stays inside the ring: the
          # hours row needs 82 px of half-width (pair + stagger + the oblique's
          # overhang) and the circle only offers that from y=44 down.
          - label:
              id: ui_h1
              align: top_mid
              x: -46
              y: 44
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"
          - label:
              id: ui_h2
              align: top_mid
              x: 14
              y: 44
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"
          - label:
              id: ui_m1
              align: top_mid
              x: -14
              y: 120
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"
          - label:
              id: ui_m2
              align: top_mid
              x: 46
              y: 120
              text_font: font_clock
              text_color: 0xF0EAE0
              text: "-"

          - label:
              id: ui_devid
              align: center
              y: 4
              text_font: font_id
              text_color: 0xF0EAE0
              text: ""
              hidden: true

          - label:
              id: ui_devid_cap
              align: center
              y: -34
              text_font: font_slot
              text_color: 0x707880
              text: "ID"
              hidden: true

          # The QR's quiet zone: lv_qrcode paints the light colour only under
          # the modules themselves, and a code that runs straight into black
          # pixels does not scan.
          - obj:
              id: ui_ap_card
              align: center
              y: -14
              width: 140
              height: 140
              radius: 6
              bg_color: 0xFFFFFF
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true

          - qrcode:
              id: ui_ap_qr
              align: center
              y: -14
              size: 124
              dark_color: 0x000000
              light_color: 0xFFFFFF
              hidden: true

          # Shown only when the clock cannot be: these replace the digits rather
          # than sharing the face with them. Four slots, because the AP face has
          # to label two Latin strings that mean nothing on their own -- the
          # network name and its password. Positions are set at runtime by
          # refresh_face, since a two-line face and a four-line face cannot
          # share one set of offsets.

          - label:
              id: ui_msg_cap
              align: center
              y: -56
              text_font: font_slot
              text_color: 0x707880
              text: ""
              hidden: true

          - label:
              id: ui_msg
              align: center
              y: -6
              text_font: font_msg
              text_color: 0xC2C8D0
              text: ""
              hidden: true

          - label:
              id: ui_msg_sub
              align: center
              y: 22
              text_font: font_slot
              text_color: 0x707880
              text: ""
              hidden: true

          - label:
              id: ui_msg2
              align: center
              y: 30
              text_font: font_msg
              text_color: 0xC2C8D0
              text: ""
              hidden: true

          - label:
              id: ui_slot
              align: bottom_mid
              y: -25
              text_font: font_slot
              text_color: 0xC2C8D0
              text: ""


          - label:
              id: ui_pocket
              align: top_left
              x: 16
              y: 12
              text_font: font_slot
              text_color: 0xFF9E3D
              text: ""

          # Battery, drawn rather than written. Sits in the pocket the stagger
          # of the hours leaves free, and stays hidden while on USB.
          # Кути по діагоналі, ПОЗА кільцем (137 px від центру проти радіуса
          # 114): там нічого немає, а кишеня після ряду годин потрібна слоту
          # піктограми. На панелі ці два індикатори й так ледь помітні, тож кут
          # їм не шкодить.
          - obj:
              id: ui_batt_body
              x: 204
              y: 19
              width: 22
              height: 11
              radius: 2
              bg_opa: TRANSP
              border_width: 1
              border_color: 0x707880
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true
          - obj:
              id: ui_batt_nub
              x: 226
              y: 22
              width: 2
              height: 5
              radius: 0
              bg_color: 0x707880
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true
          - obj:
              id: ui_batt_fill
              x: 206
              y: 21
              width: 12
              height: 7
              radius: 0
              bg_color: 0x707880
              bg_opa: cover
              border_width: 0
              pad_all: 0
              scrollable: false
              clickable: false
              hidden: true

sensor:

  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 30s
  - platform: uptime
    name: "Uptime"

  - platform: htram_gd32
    co2:
      name: "CO2"
      id: sensor_co2
      on_value:
        - script.execute: refresh_leds
    temperature:
      name: "Temperature"
      id: sensor_temp
      filters:
        # Запам'ятовуємо те, що прийшло від GD32, і зсуваємо на підстроювання.
        # Порядок важливий: вологість нижче рахується від цієї ж температури.
        - lambda: |-
            id(t_from_gd32) = x;
            const float trim = id(temp_trim).state;
            return isnan(trim) ? x : x + trim;
      on_value:
        - lambda: if (id(slot_idx) == 1) id(refresh_slot).execute();
    humidity:
      name: "Humidity"
      id: sensor_hum
      filters:
        # Вологість власного підстроювання не має — воно випливає з
        # температурного: тепліший за повітря датчик показує нижчу RH за тієї
        # самої кількості води. Той самий перерахунок через тиск насиченої
        # пари, що й у GD32, тільки від уже скоригованої точки.
        - lambda: |-
            const float trim = id(temp_trim).state;
            const float ts = id(t_from_gd32);
            if (isnan(trim) || isnan(ts) || trim == 0.0f) return x;
            auto es = [](float t) { return 6.112f * expf(17.62f * t / (243.12f + t)); };
            const float rh = x * es(ts) / es(ts + trim);
            return rh > 100.0f ? 100.0f : (rh < 0.0f ? 0.0f : rh);
      on_value:
        - lambda: if (id(slot_idx) == 1) id(refresh_slot).execute();
    battery:
      name: "Battery Voltage"
      id: sensor_batt_mv
    battery_level:
      name: "Battery"
      id: sensor_batt_level
      on_value:
        - script.execute: refresh_pocket

binary_sensor:
  - platform: htram_gd32
    usb:
      name: "USB Power"
      id: sensor_usb
      on_state:
        - script.execute: refresh_pocket
    charging:
      name: "Charging"
      id: sensor_chrg
    button:
      name: "Button"
      id: htram_button
      on_press:
        - script.execute: on_button_press
      on_release:
        - script.execute: on_button_release

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic
      disabled_by_default: true

  - platform: version
    name: "ESPHome Version"
  - platform: template
    id: device_id
    name: "Device ID"
    icon: "mdi:identifier"
    entity_category: diagnostic
  - platform: htram_gd32
    firmware_version:
      name: "GD32 Firmware"
      entity_category: diagnostic
    spi_flash:
      name: "GD32 SPI Flash"
      entity_category: diagnostic
    button_action:
      name: "Button Action"
      on_value:
        - if:
            condition:
              lambda: return !x.empty();
            then:
              - script.execute:
                  id: on_button_action
                  action: !lambda "return x;"
  - platform: template
    id: arbiter_context_sensor
    name: "Arbiter Context"
    icon: "mdi:state-machine"
    entity_category: diagnostic
    lambda: return id(htram_arbiter_hub)->get_active_context();
    update_interval: 1s

button:
  - platform: template
    name: "Show Device ID"
    icon: "mdi:identifier"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - script.execute: show_device_id

  - platform: template
    name: "Simulate Single Click"
    id: btn_sim_single
    icon: "mdi:gesture-tap-button"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(htram_arbiter_hub)->dispatch_button_action("single");

  - platform: template
    name: "Simulate Double Click"
    id: btn_sim_double
    icon: "mdi:gesture-double-tap"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(htram_arbiter_hub)->dispatch_button_action("double");

  - platform: template
    name: "Simulate Triple Click"
    id: btn_sim_triple
    icon: "mdi:gesture-tap"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(htram_arbiter_hub)->dispatch_button_action("triple");

  - platform: template
    name: "Simulate Long Press"
    id: btn_sim_long
    icon: "mdi:gesture-tap-hold"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(htram_arbiter_hub)->dispatch_button_action("long");

  - platform: template
    id: beep_button
    name: "Beep"
    icon: "mdi:volume-high"
    disabled_by_default: true
    on_press:
      - lambda: |-
          id(htram_core)->send_beep(2000, 200);

  - platform: template
    id: test_ota_chime_button
    name: "Сигнал оновлення OTA"
    icon: "mdi:bell-check"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          id(htram_core)->play_rtttl("${ota_done_rtttl}");

number:
  - platform: template
    name: "Screen Brightness"
    id: screen_brightness
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    set_action:
      - lambda: |-
          id(htram_core)->send_backlight(x);

  # Залишкове підстроювання температури, поверх моделі в GD32.
  #
  # Сама компенсація самонагріву живе у прошивці GD32 (sensors.c): вона одна
  # знає стан живлення і веде поправку плавно. Це число — не друга модель, а
  # калібрування конкретного примірника: плати й кімнати трохи різні, а
  # перепрошивати GD32 заради півградуса не варто. Нуль = нічого не робить.
  #
  # Додається до показу, тож для завищення потрібне від'ємне число.
  - platform: template
    name: "Підстроювання температури"
    id: temp_trim
    icon: "mdi:thermometer"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: -10
    max_value: 10
    step: 0.1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box

switch:

  # LED state is authoritative on the GD32 (it lights green at boot and mirrors
  # its real state back over telemetry); DISABLED restore keeps the ESP from
  # overriding it on connect.
  - platform: htram_gd32
    red:
      name: "LED Red"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    yellow:
      name: "LED Yellow"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    green:
      name: "LED Green"
      icon: "mdi:led-on"
      restore_mode: DISABLED


  - platform: template
    name: "LED Auto"
    icon: "mdi:television-ambient-light"
    lambda: return id(led_auto);
    turn_on_action:
      - lambda: id(led_auto) = true;
      - script.execute: refresh_leds
    turn_off_action:
      - lambda: id(led_auto) = false;
    restore_mode: RESTORE_DEFAULT_ON
