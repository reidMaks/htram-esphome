substitutions:
  name: htram
  # Якщо назва задається для кожного пристрою окремо (GitOps), суфікс вимикається.
  # Вмикайте лише якщо всі пристрої шиються з одного конфігу без власного name.
  name_add_mac_suffix: "false"
  friendly_name: HTRAM
  # Базовий URL для шрифтів та зображень (GitOps)
  repo_url: "https://raw.githubusercontent.com/reidMaks/htram-esphome/main/esphome"
  # Сигнал після успішної прошивки (короткий висхідний тризвук a6, b6, c7 у резонансній смузі динаміка)
  ota_done_rtttl: "Flashed:d=16,o=6,b=240:a,b,c7"
  firmware_version: "2.1.3"

packages:
  ui: !include core-ui.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: reidmaks.htram
    version: ${firmware_version}
  # Several of these are going to live in the same house, and they are all
  # flashed from this one config. The MAC suffix keeps their hostnames and
  # entity ids apart without a per-device file. Drop this line to go back to a
  # plain "htram".
  name_add_mac_suffix: ${name_add_mac_suffix}
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            esphome::htram_web::restore_permanent_wifi();
        - text_sensor.template.publish:
            id: device_id
            state: !lambda "return esphome::get_mac_address().substr(6);"
    # LVGL builds its widget tree in setup(), so anything that touches ui_* has
    # to wait until every component is up.
    - priority: -100
      then:
        - lambda: |-
            id(htram_standalone_web).sync_to_system();
            id(htram_arbiter_hub)->set_core(id(htram_core));
        - script.execute: refresh_leds
        - script.execute: refresh_face
        - script.execute: check_flash_chime
        - script.execute:
            id: apply_scheduled_brightness
            smooth: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

logger:
  baud_rate: 115200

http_request:
  id: htram_http_request
  timeout: 30s
  buffer_size_rx: 4096
  buffer_size_tx: 4096
  verify_ssl: false

ota:
  - platform: http_request
    id: http_ota
  - platform: esphome
    password: !secret ota_password
    # The ESP's own update is the longer of the two blackouts: about eight
    # seconds during which the panel keeps its last frame, because the GD32
    # gets nothing to draw. The GD32 update signals itself from firmware, but
    # nothing covered this one -- and a person watching a frozen screen for
    # eight seconds is exactly who reaches for the cable.
    #
    # All three at once is a combination the CO2 logic never produces. No
    # restore needed: the ESP reboots into a fresh state and refresh_leds puts
    # the real colour back.
    on_begin:
      then:
        - lambda: "id(htram_core)->send_leds(1, 1, 1, 1);"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "HTRAM Setup"
    ap_timeout: 15s
  on_connect:
    then:
      - lambda: |-
          esphome::htram_web::auto_save_active_wifi();
      - script.execute: refresh_pocket
      - script.execute: refresh_face
  on_disconnect:
    then:
      - script.execute: refresh_pocket
      - script.execute: refresh_face

captive_portal:


# Скільки пам'яті лишається під навантаженням, і чому саме перезавантажився.
debug:
  update_interval: 30s

web_server_base:

external_components:
  - source:
      type: local
      path: custom_components
    components: [htram_gd32, htram_arbiter, htram_web, standalone_time, captive_portal]

htram_web:
  id: htram_standalone_web
  version: ${firmware_version}
  on_ota_update:
    then:
      - script.execute: trigger_ota_update
  on_save_settings:
    then:
      - script.execute:
          id: on_geo_settings_changed
          region: !lambda "return region;"
          lat: !lambda "return lat;"
          lon: !lambda "return lon;"
          city: !lambda "return city;"

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  # 921600 since the GD32 stopped blocking its main loop for longer than the
  # 2 KB RX ring can absorb (SHT30 split in two, CO2 poll behind flow control).
  # The resident flasher inherits USART1_BAUD from the firmware, so GD32 OTA
  # runs at this speed too.
  baud_rate: 921600

htram_gd32:
  id: htram_core
  uart_id: uart_bus

htram_arbiter:
  id: htram_arbiter_hub
  events:
    - event: button_triple
      context: any
      priority: 10
      name: core_show_device_id
      then:
        - script.execute: show_device_id
    - event: button_single
      context: modal_ap
      priority: 100
      name: core_toggle_ap_page
      then:
        - lambda: |-
            id(ap_manual) = true;
            id(ap_page) ^= 1;
            id(face_state) = -1;
            lv_obj_invalidate(lv_screen_active());
        - script.execute: refresh_face
    - event: button_quadruple
      context: modal_ap
      priority: 100
      name: core_dismiss_ap_quadruple
      then:
        - script.execute: dismiss_wifi_setup
    - event: button_double
      context: modal_ap
      priority: 100
      name: core_dismiss_ap_double
      then:
        - script.execute: dismiss_wifi_setup
    - event: button_many
      context: modal_ap
      priority: 100
      name: core_dismiss_ap_many
      then:
        - script.execute: dismiss_wifi_setup
    - event: button_long
      context: modal_ap
      priority: 100
      name: core_dismiss_ap_long
      then:
        - script.execute: dismiss_wifi_setup
    - event: screen_preempted
      context: modal_ap
      priority: 100
      name: core_preempt_ap
      then:
        - script.execute: dismiss_wifi_setup
    - event: button_single
      context: modal_overlay
      priority: 100
      name: core_dismiss_overlay
      then:
        - script.stop: show_device_id
        - lambda: |-
            id(htram_arbiter_hub)->release_screen("overlay");
            lv_obj_add_flag(id(ui_devid), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ui_devid_cap), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(ui_pocket), LV_OBJ_FLAG_HIDDEN);
            id(slot_hold) = false;
        - script.execute: refresh_face
        - script.execute: refresh_pocket
    - event: screen_preempted
      context: modal_overlay
      priority: 100
      name: core_preempt_overlay
      then:
        - script.stop: show_device_id
        - lambda: |-
            id(htram_arbiter_hub)->release_screen("overlay");
            lv_obj_add_flag(id(ui_devid), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ui_devid_cap), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ui_msg_sub), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(ui_pocket), LV_OBJ_FLAG_HIDDEN);
            id(slot_hold) = false;
    - event: button_many
      context: any
      priority: 10
      name: core_setup_wifi_many
      then:
        - script.execute: start_wifi_setup
    - event: button_quadruple
      context: any
      priority: 10
      name: core_setup_wifi_quadruple
      then:
        - script.execute: start_wifi_setup
    - event: time_synced
      context: any
      priority: 9
      name: core_auto_brightness_on_time_sync
      then:
        - script.execute:
            id: apply_scheduled_brightness
            smooth: false

globals:
  - id: current_backlight_val
    type: float
    restore_value: false
    initial_value: "100.0"
  - id: day_brightness
    type: float
    restore_value: true
    initial_value: "100.0"
  - id: led_auto
    type: bool
    restore_value: true
    initial_value: "true"

  # Температура так, як її прислав GD32, до підстроювання нижче: фільтр
  # вологості рахує від неї. У телеметрії T публікується перед RH з того
  # самого пакета, тож на момент фільтра RH значення свіже.
  - id: t_from_gd32
    type: float
    restore_value: false
    initial_value: "NAN"
  # Відстеження перепрошивки: хеш дати/часу збірки зберігається в NVS.
  # Якщо поточний білд відрізняється — це перше завантаження після прошивки.
  - id: last_boot_build_hash
    type: int
    restore_value: true
    initial_value: "0"

script:
  - id: !extend set_system_alert_active
    then:
      - lambda: |-
          id(htram_standalone_web).set_alert_active(active);

  # Сигнал після першого завантаження свіжої прошивки:
  - id: check_flash_chime
    then:
      - delay: 1s
      - lambda: |-
          const uint32_t current_hash = esphome::fnv1_hash(__DATE__ " " __TIME__);
          if (id(last_boot_build_hash) != (int) current_hash) {
            id(last_boot_build_hash) = (int) current_hash;
            ESP_LOGI("htram", "First boot after firmware flash (build: %s %s)!", __DATE__, __TIME__);
            id(htram_core)->play_rtttl("${ota_done_rtttl}");
          }

  - id: start_wifi_setup
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("wifi_setup", "Triggering Wi-Fi provisioning on demand via physical gesture");
          id(htram_arbiter_hub)->play_beep(esphome::htram_arbiter::SOUND_PRIO_UI, "setup", 2000, 150);

          #ifdef USE_CAPTIVE_PORTAL
          if (captive_portal::global_captive_portal != nullptr) {
            #ifdef USE_WIFI
            if (wifi::global_wifi_component != nullptr) {
              class WiFiHelper {
               public:
                static void ensure_ap(wifi::WiFiComponent *w) {
                  w->start_scanning();
                }
              };
              WiFiHelper::ensure_ap(wifi::global_wifi_component);
            }
            #endif
            if (!captive_portal::global_captive_portal->is_active()) {
              captive_portal::global_captive_portal->start();
            }
          }
          #endif

          id(htram_arbiter_hub)->request_screen(5, "ap");
          id(ap_manual) = false;
          id(ap_page) = 0;
          id(face_state) = -1;
          id(refresh_face).execute();

  - id: dismiss_wifi_setup
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("wifi_setup", "Dismissing Wi-Fi setup modal via physical gesture");
          id(htram_arbiter_hub)->play_beep(esphome::htram_arbiter::SOUND_PRIO_UI, "dismiss", 1500, 100);
          #ifdef USE_CAPTIVE_PORTAL
          if (captive_portal::global_captive_portal != nullptr && captive_portal::global_captive_portal->is_active()) {
            captive_portal::global_captive_portal->end();
          }
          #endif
          id(ap_manual) = false;
          if (id(htram_arbiter_hub)->get_screen_owner() == "ap") {
            id(htram_arbiter_hub)->release_screen("ap");
          }
          lv_obj_invalidate(id(ui_root));
          id(face_state) = -1;
      - script.execute: refresh_face
      - script.execute: refresh_clock
      - script.execute: refresh_slot
      - script.execute: refresh_pocket


  - id: trigger_ota_update
    mode: single
    then:
      - lambda: |-
          esphome::htram_web::auto_save_active_wifi();
          ESP_LOGI("ota", "Starting full 1-click update from GitHub Releases (assets, GD32, ESP32)...");
          id(htram_arbiter_hub)->set_leds(100, "ota", 1, 1, 1, 1);
          bool allow_battery = id(htram_standalone_web)->get_ota_allow_on_battery();

          // 1. Update graphic assets on SPI Flash if available
          id(htram_core)->perform_remote_assets_update(id(htram_http_request));

          // 2. Update GD32 coprocessor firmware if available
          id(htram_core)->perform_remote_gd32_update(id(htram_http_request), allow_battery);

          // 3. Flash ESP32 firmware
      - ota.http_request.flash:
          url: "https://github.com/reidMaks/htram-esphome/releases/latest/download/htram-standalone.bin"
          md5_url: "https://github.com/reidMaks/htram-esphome/releases/latest/download/htram-standalone.bin.md5"

  # CO2 moved off the screen and onto the LEDs above it, so they have to
  # actually track it now.
  - id: refresh_leds
    then:
      - lambda: |-
          if (!id(led_auto)) {
            id(htram_arbiter_hub)->set_leds(10, "co2", 0, 0, 0, 0);
            return;
          }
          if (id(htram_arbiter_hub)->get_led_priority() > 10) return;
          // The GD32 lights green at boot to say "I am alive", and the NDIR
          // needs minutes before it has a number. Leaving that green up meant
          // the device asserted clean air while it had measured nothing at all,
          // which is the one claim it must never make on faith.
          if (isnan(id(sensor_co2).state)) {
            id(htram_arbiter_hub)->set_leds(10, "co2", 0, 0, 0, 0);
            return;
          }
          uint16_t ppm = (uint16_t) id(sensor_co2).state;
          const uint16_t y = (uint16_t) id(co2_thresh_yellow).state;
          const uint16_t r = (uint16_t) id(co2_thresh_red).state;
          id(htram_arbiter_hub)->set_leds(10, "co2", ppm >= r, ppm >= y && ppm < r, ppm < y, 0);

  # Плавна зміна яскравості дисплея за 3–4 секунди кроками по 100 мс
  - id: fade_backlight
    mode: restart
    parameters:
      target: float
    then:
      - lambda: |-
          if (target < 0.0f) target = 0.0f;
          if (target > 100.0f) target = 100.0f;
      - while:
          condition:
            lambda: |-
              return std::abs(id(current_backlight_val) - target) > 0.5f;
          then:
            - lambda: |-
                float cur = id(current_backlight_val);
                float step = (target - cur) * 0.15f;
                if (std::abs(step) < 1.0f) {
                  step = (target > cur) ? 1.0f : -1.0f;
                }
                cur += step;
                if ((step > 0.0f && cur > target) || (step < 0.0f && cur < target)) {
                  cur = target;
                }
                id(current_backlight_val) = cur;
                id(htram_core)->send_backlight((uint8_t) std::round(cur));
            - delay: 100ms
      - lambda: |-
          id(current_backlight_val) = target;
          id(htram_core)->send_backlight((uint8_t) std::round(target));
          id(screen_brightness).publish_state(target);

  # Застосування розкладу яскравості відповідно до поточного часу
  - id: apply_scheduled_brightness
    mode: restart
    parameters:
      smooth: bool
    then:
      - lambda: |-
          if (!id(night_mode_enabled).state) {
            float day_target = id(day_brightness);
            if (smooth) {
              id(fade_backlight).execute(day_target);
            } else {
              id(current_backlight_val) = day_target;
              id(htram_core)->send_backlight((uint8_t) std::round(day_target));
              id(screen_brightness).publish_state(day_target);
            }
            return;
          }
          auto now = id(ha_time).now();
          if (!now.is_valid()) now = id(net_time).now();
          if (!now.is_valid()) return;

          int cur_min = now.hour * 60 + now.minute;
          int night_min = id(night_start_time).hour * 60 + id(night_start_time).minute;
          int day_min = id(day_start_time).hour * 60 + id(day_start_time).minute;
          bool is_night = false;
          if (night_min > day_min) {
            is_night = (cur_min >= night_min || cur_min < day_min);
          } else if (night_min < day_min) {
            is_night = (cur_min >= night_min && cur_min < day_min);
          }
          float target = is_night ? id(night_brightness).state : id(day_brightness);
          if (smooth) {
            id(fade_backlight).execute(target);
          } else {
            id(current_backlight_val) = target;
            id(htram_core)->send_backlight((uint8_t) std::round(target));
            id(screen_brightness).publish_state(target);
          }

interval:
  # A GD32 that has just restarted spent its first ~700 ms with no USART1,
  # so the top of our last frame and every command we sent in that window
  # were dropped on the floor -- which is why a standby wake used to leave
  # a strip of the GD32's own boot screen across the top of the face, in
  # the one band LVGL never invalidates again. It tells us when it is ready
  # now; everything it missed goes out again here.
  - interval: 1s
    then:
      - lambda: |-
          if (id(htram_core)->consume_gd32_boot()) {
            ESP_LOGI("resync", "GD32 restarted: full repaint + LED/backlight resend");
            id(htram_core)->send_backlight((uint8_t) id(screen_brightness).state);
            id(htram_core)->resend_leds();
            id(face_state) = -1;          // the face may be stale as well
            id(refresh_face).execute();
            id(refresh_leds).execute();   // auto mode overrides the resend
            lv_obj_invalidate(lv_screen_active());
          }

  - interval: 5s
    then:
      - script.execute: refresh_pocket
      - script.execute: refresh_face

time:
  - platform: sntp
    id: net_time
    timezone: "Europe/Kyiv"
    servers:
      - time.google.com
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    on_time_sync:
      then:
        - lambda: |-
            id(face_state) = -1;
            id(htram_arbiter_hub)->dispatch_event("time_synced");
        - script.execute: refresh_pocket
        - script.execute: refresh_face

  - platform: standalone_time
    id: ha_time
    timezone: "Europe/Kyiv"


sensor:

  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 30s
  - platform: uptime
    name: "Uptime"

  - platform: htram_gd32
    co2:
      name: "CO2"
      id: sensor_co2
      on_value:
        - script.execute: refresh_leds
    temperature:
      name: "Temperature"
      id: sensor_temp
      filters:
        # Запам'ятовуємо те, що прийшло від GD32, і зсуваємо на підстроювання.
        # Порядок важливий: вологість нижче рахується від цієї ж температури.
        - lambda: |-
            id(t_from_gd32) = x;
            const float trim = id(temp_trim).state;
            return isnan(trim) ? x : x + trim;
      on_value:
        - lambda: if (id(slot_idx) == 1) id(refresh_slot).execute();
    humidity:
      name: "Humidity"
      id: sensor_hum
      filters:
        # Вологість власного підстроювання не має — воно випливає з
        # температурного: тепліший за повітря датчик показує нижчу RH за тієї
        # самої кількості води. Той самий перерахунок через тиск насиченої
        # пари, що й у GD32, тільки від уже скоригованої точки.
        - lambda: |-
            const float trim = id(temp_trim).state;
            const float ts = id(t_from_gd32);
            if (isnan(trim) || isnan(ts) || trim == 0.0f) return x;
            auto es = [](float t) { return 6.112f * expf(17.62f * t / (243.12f + t)); };
            const float rh = x * es(ts) / es(ts + trim);
            return rh > 100.0f ? 100.0f : (rh < 0.0f ? 0.0f : rh);
      on_value:
        - lambda: if (id(slot_idx) == 1) id(refresh_slot).execute();
    battery:
      name: "Battery Voltage"
      id: sensor_batt_mv
    battery_level:
      name: "Battery"
      id: sensor_batt_level
      on_value:
        - script.execute: refresh_pocket

binary_sensor:
  - platform: htram_gd32
    usb:
      name: "USB Power"
      id: sensor_usb
      on_state:
        - script.execute: refresh_pocket
    charging:
      name: "Charging"
      id: sensor_chrg
    button:
      name: "Button"
      id: htram_button
      on_press:
        - script.execute: on_button_press
      on_release:
        - script.execute: on_button_release

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic
      disabled_by_default: true

  - platform: version
    name: "ESPHome Version"
  - platform: template
    id: device_id
    name: "Device ID"
    icon: "mdi:identifier"
    entity_category: diagnostic
  - platform: htram_gd32
    firmware_version:
      name: "GD32 Firmware"
      entity_category: diagnostic
    spi_flash:
      name: "GD32 SPI Flash"
      entity_category: diagnostic
    button_action:
      name: "Button Action"
      on_value:
        - if:
            condition:
              lambda: return !x.empty();
            then:
              - script.execute:
                  id: on_button_action
                  action: !lambda "return x;"

datetime:
  - platform: template
    id: night_start_time
    name: "Початок ночі"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "23:00:00"
    icon: "mdi:clock-start"
    on_time:
      - if:
          condition:
            lambda: return id(night_mode_enabled).state;
          then:
            - script.execute:
                id: fade_backlight
                target: !lambda "return id(night_brightness).state;"
    on_value:
      - script.execute:
          id: apply_scheduled_brightness
          smooth: true

  - platform: template
    id: day_start_time
    name: "Початок дня"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
    icon: "mdi:clock-end"
    on_time:
      - if:
          condition:
            lambda: return id(night_mode_enabled).state;
          then:
            - script.execute:
                id: fade_backlight
                target: !lambda "return id(day_brightness);"
    on_value:
      - script.execute:
          id: apply_scheduled_brightness
          smooth: true

number:
  - platform: template
    name: "Screen Brightness"
    id: screen_brightness
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(fade_backlight).stop();
          id(current_backlight_val) = x;
          id(htram_core)->send_backlight((uint8_t) std::round(x));

          bool is_night = false;
          if (id(night_mode_enabled).state) {
            auto now = id(ha_time).now();
            if (!now.is_valid()) now = id(net_time).now();
            if (now.is_valid()) {
              int cur_min = now.hour * 60 + now.minute;
              int night_min = id(night_start_time).hour * 60 + id(night_start_time).minute;
              int day_min = id(day_start_time).hour * 60 + id(day_start_time).minute;
              if (night_min > day_min) is_night = (cur_min >= night_min || cur_min < day_min);
              else if (night_min < day_min) is_night = (cur_min >= night_min && cur_min < day_min);
            }
          }
          if (!is_night) {
            id(day_brightness) = x;
          }

  - platform: template
    name: "Нічна яскравість"
    id: night_brightness
    icon: "mdi:brightness-4"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 4
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if (id(night_mode_enabled).state) {
            auto now = id(ha_time).now();
            if (!now.is_valid()) now = id(net_time).now();
            if (now.is_valid()) {
              int cur_min = now.hour * 60 + now.minute;
              int night_min = id(night_start_time).hour * 60 + id(night_start_time).minute;
              int day_min = id(day_start_time).hour * 60 + id(day_start_time).minute;
              bool is_night = false;
              if (night_min > day_min) is_night = (cur_min >= night_min || cur_min < day_min);
              else if (night_min < day_min) is_night = (cur_min >= night_min && cur_min < day_min);
              if (is_night) {
                id(fade_backlight).execute(x);
              }
            }
          }

  # Залишкове підстроювання температури, поверх моделі в GD32.
  #
  # Сама компенсація самонагріву живе у прошивці GD32 (sensors.c): вона одна
  # знає стан живлення і веде поправку плавно. Це число — не друга модель, а
  # калібрування конкретного примірника: плати й кімнати трохи різні, а
  # перепрошивати GD32 заради півградуса не варто. Нуль = нічого не робить.
  #
  # Додається до показу, тож для завищення потрібне від'ємне число.
  - platform: template
    name: "Підстроювання температури"
    id: temp_trim
    icon: "mdi:thermometer"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: -10
    max_value: 10
    step: 0.1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box

  - platform: template
    name: "CO2 Yellow Threshold"
    id: co2_thresh_yellow
    icon: "mdi:molecule-co2"
    entity_category: config
    unit_of_measurement: "ppm"
    min_value: 600
    max_value: 2500
    step: 50
    initial_value: 1000
    restore_value: true
    optimistic: true
    set_action:
      - script.execute: refresh_leds

  - platform: template
    name: "CO2 Red Threshold"
    id: co2_thresh_red
    icon: "mdi:molecule-co2"
    entity_category: config
    unit_of_measurement: "ppm"
    min_value: 800
    max_value: 5000
    step: 50
    initial_value: 1500
    restore_value: true
    optimistic: true
    set_action:
      - script.execute: refresh_leds

switch:

  # LED state is authoritative on the GD32 (it lights green at boot and mirrors
  # its real state back over telemetry); DISABLED restore keeps the ESP from
  # overriding it on connect.
  - platform: htram_gd32
    red:
      name: "LED Red"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    yellow:
      name: "LED Yellow"
      icon: "mdi:led-on"
      restore_mode: DISABLED
    green:
      name: "LED Green"
      icon: "mdi:led-on"
      restore_mode: DISABLED


  - platform: template
    name: "LED Auto"
    id: switch_led_auto
    icon: "mdi:television-ambient-light"
    lambda: return id(led_auto);
    turn_on_action:
      - lambda: id(led_auto) = true;
      - script.execute: refresh_leds
    turn_off_action:
      - lambda: |-
          id(led_auto) = false;
          id(htram_arbiter_hub)->set_leds(10, "co2", 0, 0, 0, 0);
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Нічний розклад"
    id: night_mode_enabled
    icon: "mdi:weather-night"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute:
          id: apply_scheduled_brightness
          smooth: true
    on_turn_off:
      - script.execute:
          id: fade_backlight
          target: !lambda "return id(day_brightness);"
