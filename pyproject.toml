[project]
name = "htram-esphome"
version = "0.1.0"
description = "Custom firmware for the Honeywell HTRAM: ESPHome on the ESP32, bare-metal on the GD32"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Builds and flashes the ESP32 half, and drives the GD32 OTA through it.
    "esphome>=2026.8.2",
    "esptool>=5.3.1",
    "pyserial>=3.5",
    # tools/swd: SWD flashing and the SRAM probes.
    "pyocd>=0.45.1",
    # tools/swd/flash.py posts the GD32 image to the ESP's /gd32_ota endpoint.
    "requests>=2.32",
]

[dependency-groups]
dev = [
    # tools/fonts/make_oblique.py bakes the slanted clock face.
    "fonttools>=4.64.0",
    # tools/images: SVG -> 1-bit mask, and tracing silhouettes out of screenshots.
    "cairosvg>=2.7",
    "pillow>=11",
    "scikit-image>=0.26.0",
    # Testing frameworks and coverage
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "gcovr>=7.0",
    # Linters and static analysis
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "yamllint>=1.35.0",
    "clang-format>=19.0.0",
    "clang-tidy>=19.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/tools", "tests/esphome_config"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true


